<rect x='336.25' y='105' width='96.5' height='185' fill='#81A6BD' fill-opacity='1' data-row-index='2' data-extent-axis='y' data-extent-anchor='end'><title>74</title></rect>
<rect x='466.25' y='152.5' width='96.5' height='137.5' fill='#1D577A' fill-opacity='1' data-row-index='3' data-extent-axis='y' data-extent-anchor='end'><title>55</title></rect>
<line class='plot-tick' x1='66.5' y1='115' x2='183.5' y2='115' stroke='#9ca3af' stroke-width='2' data-row-index='0'><title>Target</title></line>
