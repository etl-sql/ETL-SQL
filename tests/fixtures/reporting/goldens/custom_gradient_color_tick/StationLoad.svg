<svg xmlns='http://www.w3.org/2000/svg' width='600' height='350' viewBox='0 0 600 350' role='img' aria-labelledby='StationLoad-title StationLoad-desc' font-family='sans-serif'>
<title id='StationLoad-title'>Sequential quantitative colour with a per-category target tick</title>
<desc id='StationLoad-desc'>Sequential quantitative colour with a per-category target tick: 4 rows, 2 ordered layers, 1 series, 1 facet panels, 0 gaps, 0 skipped rows. Color ranges from 0 (#e0f2fe) to 100 (#0c4a6e).</desc>
<rect width='600' height='350' fill='white'/>
<text x='300' y='17' text-anchor='middle' font-size='13' font-weight='bold' fill='#333'>Sequential quantitative colour with a per-category target tick</text>
<line x1='60' y1='40' x2='60' y2='290' stroke='#bbb'/>
<line x1='60' y1='290' x2='580' y2='290' stroke='#bbb'/>
<line x1='60' y1='290' x2='580' y2='290' stroke='#e5e7eb'/>
