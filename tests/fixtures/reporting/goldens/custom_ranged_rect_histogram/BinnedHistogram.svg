<svg xmlns='http://www.w3.org/2000/svg' width='600' height='350' viewBox='0 0 600 350' role='img' aria-labelledby='BinnedHistogram-title BinnedHistogram-desc' font-family='sans-serif'>
<title id='BinnedHistogram-title'>Explicit-bin histogram authored as ranged rectangles</title>
<desc id='BinnedHistogram-desc'>Explicit-bin histogram authored as ranged rectangles: 3 rows, 1 ordered layers, 1 series, 1 facet panels, 0 gaps, 0 skipped rows.</desc>
<rect width='600' height='350' fill='white'/>
<text x='300' y='17' text-anchor='middle' font-size='13' font-weight='bold' fill='#333'>Explicit-bin histogram authored as ranged rectangles</text>
<line x1='60' y1='40' x2='60' y2='290' stroke='#bbb'/>
<line x1='60' y1='290' x2='580' y2='290' stroke='#bbb'/>
<line x1='60' y1='290' x2='580' y2='290' stroke='#e5e7eb'/>
<line x1='60' y1='227.5' x2='580' y2='227.5' stroke='#e5e7eb'/>
<line x1='60' y1='165' x2='580' y2='165' stroke='#e5e7eb'/>
<line x1='60' y1='102.5' x2='580' y2='102.5' stroke='#e5e7eb'/>
<line x1='60' y1='40' x2='580' y2='40' stroke='#e5e7eb'/>
<defs><clipPath id='BinnedHistogram-plot-clip'><rect x='60' y='40' width='520' height='250'/></clipPath></defs>
<g clip-path='url(#BinnedHistogram-plot-clip)'>
<rect class='plot-range-rect' x='60' y='190' width='130' height='100' fill='#5470c6' fill-opacity='1' data-row-index='0'><title>40</title></rect>
<rect class='plot-range-rect' x='190' y='140' width='130' height='150' fill='#5470c6' fill-opacity='1' data-row-index='1'><title>60</title></rect>
<rect class='plot-range-rect' x='320' y='240' width='260' height='50' fill='#5470c6' fill-opacity='1' data-row-index='2'><title>20</title></rect>
</g>
<line x1='56' y1='290' x2='60' y2='290' stroke='#bbb'/>
<text x='54' y='294' text-anchor='end' font-size='9' fill='#666'>0</text>
<line x1='56' y1='227.5' x2='60' y2='227.5' stroke='#bbb'/>
<text x='54' y='231.5' text-anchor='end' font-size='9' fill='#666'>25</text>
<line x1='56' y1='165' x2='60' y2='165' stroke='#bbb'/>
<text x='54' y='169' text-anchor='end' font-size='9' fill='#666'>50</text>
<line x1='56' y1='102.5' x2='60' y2='102.5' stroke='#bbb'/>
<text x='54' y='106.5' text-anchor='end' font-size='9' fill='#666'>75</text>
<line x1='56' y1='40' x2='60' y2='40' stroke='#bbb'/>
<text x='54' y='44' text-anchor='end' font-size='9' fill='#666'>100</text>
</svg>
