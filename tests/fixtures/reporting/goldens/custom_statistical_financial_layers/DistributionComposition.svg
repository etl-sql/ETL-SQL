<svg xmlns='http://www.w3.org/2000/svg' width='600' height='350' viewBox='0 0 600 350' role='img' aria-labelledby='DistributionComposition-title DistributionComposition-desc' font-family='sans-serif'>
<title id='DistributionComposition-title'>Box plot plus mean tick</title>
<desc id='DistributionComposition-desc'>Box plot plus mean tick: 2 rows, 2 ordered layers, 1 series, 1 facet panels, 0 gaps, 0 skipped rows.</desc>
<rect width='600' height='350' fill='white'/>
<text x='300' y='17' text-anchor='middle' font-size='13' font-weight='bold' fill='#333'>Box plot plus mean tick</text>
<line x1='60' y1='40' x2='60' y2='290' stroke='#bbb'/>
<line x1='60' y1='290' x2='580' y2='290' stroke='#bbb'/>
<line x1='60' y1='290' x2='580' y2='290' stroke='#e5e7eb'/>
<line x1='60' y1='227.5' x2='580' y2='227.5' stroke='#e5e7eb'/>
