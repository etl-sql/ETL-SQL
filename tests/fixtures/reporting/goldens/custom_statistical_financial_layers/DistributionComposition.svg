<g clip-path='url(#DistributionComposition-plot-clip)'>
<g class='plot-boxplot' data-layer='boxes'>
<g data-row-index='0'><title>Mon: low 8, Q1 9, median 11, Q3 14, high 15</title><line x1='190' y1='71.25' x2='190' y2='290' stroke='#5470c6'/><line x1='158.313' y1='71.25' x2='221.688' y2='71.25' stroke='#5470c6'/><line x1='158.313' y1='290' x2='221.688' y2='290' stroke='#5470c6'/><rect x='126.625' y='102.5' width='126.75' height='156.25' fill='#5470c6' fill-opacity='.35' stroke='#5470c6'/><line x1='126.625' y1='196.25' x2='253.375' y2='196.25' stroke='#5470c6' stroke-width='2'/></g>
<g data-row-index='1'><title>Tue: low 9, Q1 10, median 12, Q3 15, high 16</title><line x1='450' y1='40' x2='450' y2='258.75' stroke='#5470c6'/><line x1='418.313' y1='40' x2='481.688' y2='40' stroke='#5470c6'/><line x1='418.313' y1='258.75' x2='481.688' y2='258.75' stroke='#5470c6'/><rect x='386.625' y='71.25' width='126.75' height='156.25' fill='#5470c6' fill-opacity='.35' stroke='#5470c6'/><line x1='386.625' y1='165' x2='513.375' y2='165' stroke='#5470c6' stroke-width='2'/></g>
</g>
