# ETL-SQL — High-Availability / scale-out deployment.
#
# This is a SEPARATE, optional topology. The original two-server SQLite setup in docker-compose.yml is
# unchanged and remains the recommended simple deployment. Use this file only when you need multiple
# Report Portal and/or Orchestrator replicas behind a load balancer.
#
# Key differences from the simple setup:
#   • Shared PostgreSQL state (SQLite cannot be shared across replicas).
#   • Shared artifact root + shared Data Protection key ring (one named volume mounted by every replica).
#   • A Traefik load balancer in front of the Portal, with sticky sessions for node-local interactive work.
#   • The Portal reaches the Orchestrator by service name (Docker DNS round-robins across replicas).
#
# Variable replica counts — pick ONE:
#   a) set PORTAL_REPLICAS / ORCH_REPLICAS in the env file (honored by `docker compose up`), or
#   b) override at runtime with --scale (takes precedence over the env values):
#
#   cp docker-compose.ha.env.example ha.env        # then edit every CHANGE_ME
#   docker compose -f docker-compose.ha.yml --env-file ha.env up -d
#   docker compose -f docker-compose.ha.yml --env-file ha.env up -d --scale portal=3 --scale orchestrator=2
#
# Portal is published through Traefik on PORTAL_HTTP_PORT (default 8080). Neither app service publishes a
# host port, which is what lets them scale to N replicas without port collisions.
name: etlsql-ha

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB_PORTAL}
      PG_DB_ORCH: ${PG_DB_ORCH}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    image: etl-sql/orchestrator:${ETLSQL_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:5001
      - Orchestrator__Database__Provider=Postgres
      - Orchestrator__Database__ConnectionString=Host=postgres;Database=${PG_DB_ORCH};Username=${PG_USER};Password=${PG_PASSWORD}
      - Orchestrator__ApiKey=${ORCH_API_KEY}
      - Jobs__UseProcessSpawning=false
    volumes:
      - artifacts:/app/shared
    # Internal only — the Portal reaches it via the "orchestrator" service name (DNS round-robins
    # across replicas; scheduling is coordinated through Postgres leases + leader election).
    deploy:
      replicas: ${ORCH_REPLICAS:-2}

  portal:
    image: etl-sql/report-portal:${ETLSQL_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - Portal__Database__Provider=Postgres
      - Portal__Database__ConnectionString=Host=postgres;Database=${PG_DB_PORTAL};Username=${PG_USER};Password=${PG_PASSWORD}
      - Portal__ScriptRootPath=/app/shared/Reports
      - Portal__SnapshotDirectory=/app/shared/Snapshots
      - Portal__DatasetRootPath=/app/shared/datasets
      - Portal__MapRootPath=/app/shared/maps
      # Shared Data Protection key ring — every Portal replica MUST share this so cookies/protected
      # state issued by one replica validate on another.
      - Portal__Storage__KeyRingPath=/app/shared/keys
      # Identical across all Portal replicas (do not vary per replica).
      - Portal__Jwt__Secret=${PORTAL_JWT_SECRET}
      - Portal__Dataset__AtRestKey=${PORTAL_DATASET_KEY}
      - Portal__Orchestrator__ApiUrl=http://orchestrator:5001
      - Portal__Orchestrator__ApiKey=${ORCH_API_KEY}
      - Portal__LoadBalancer__SessionAffinityEnabled=true
    volumes:
      - artifacts:/app/shared
    deploy:
      replicas: ${PORTAL_REPLICAS:-3}
    labels:
      - traefik.enable=true
      - traefik.http.routers.portal.rule=PathPrefix(`/`)
      - traefik.http.routers.portal.entrypoints=web
      - traefik.http.services.portal.loadbalancer.server.port=5000
      # Sticky sessions: interactive report sessions are node-local, so pin a browser to one replica.
      - traefik.http.services.portal.loadbalancer.sticky.cookie=true
      - traefik.http.services.portal.loadbalancer.sticky.cookie.name=ETLSQL_LB_AFFINITY
      - traefik.http.services.portal.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.portal.loadbalancer.healthcheck.interval=15s

  lb:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
    volumes:
      # Read-only Docker socket so Traefik can discover Portal replicas as they scale. In production,
      # front this with a Docker socket proxy rather than mounting the socket directly.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - portal

volumes:
  pgdata:
  # Shared artifact root + key ring for every replica. Single-host only: for multi-host HA, replace
  # this with an external NFS/SMB volume (or Portal:Storage:Provider=Smb with a UNC root).
  artifacts:
