# Isolated departmental ETL-SQL environment (one environment per env file + project).
#
# Each environment gets its own PostgreSQL instance (separate container, volume, and credentials),
# its own Portal/Orchestrator databases, its own artifact root, its own keys, and its own ports —
# nothing is shared with another environment. See Docs/Operations/Departmental_Isolation.md.
#
# Usage:
#   cp environment.env.example finance.env        # then edit every CHANGE_ME value
#   docker compose --env-file finance.env -f docker-compose.environment.yml up -d
#   docker compose --env-file finance.env -f docker-compose.environment.yml down
#
# The project name comes from COMPOSE_PROJECT_NAME in the env file (etlsql-<env>), so containers,
# the default network, and named volumes are all namespaced per environment.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB_PORTAL}
      PG_DB_ORCH: ${PG_DB_ORCH}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PORT_PG}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    image: etl-sql/orchestrator:${ETLSQL_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:5001
      - Orchestrator__Database__Provider=Postgres
      - Orchestrator__Database__ConnectionString=Host=postgres;Database=${PG_DB_ORCH};Username=${PG_USER};Password=${PG_PASSWORD}
      - Orchestrator__ApiKey=${ORCH_API_KEY}
      - Jobs__UseProcessSpawning=false
    volumes:
      - ${ENV_DATA_ROOT}/Reports:/app/Reports
      - ${ENV_DATA_ROOT}/Snapshots:/app/Snapshots
      - ${ENV_DATA_ROOT}/logs:/app/logs
    ports:
      - "${PORT_ORCH}:5001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  portal:
    image: etl-sql/report-portal:${ETLSQL_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - Portal__Database__Provider=Postgres
      - Portal__Database__ConnectionString=Host=postgres;Database=${PG_DB_PORTAL};Username=${PG_USER};Password=${PG_PASSWORD}
      - Portal__ScriptRootPath=/app/Reports
      - Portal__SnapshotDirectory=/app/Snapshots
      - Portal__DatasetRootPath=/app/datasets
      - Portal__MapRootPath=/app/maps
      - Portal__Storage__KeyRingPath=/app/data/.portal-keys
      - Portal__Jwt__Secret=${PORTAL_JWT_SECRET}
      - Portal__Dataset__AtRestKey=${PORTAL_DATASET_KEY}
      - Portal__Orchestrator__ApiUrl=http://orchestrator:5001
      - Portal__Orchestrator__ApiKey=${ORCH_API_KEY}
      - Portal__FirstRun__AdminUsername=${PORTAL_ADMIN_USERNAME:-admin}
    volumes:
      - ${ENV_DATA_ROOT}/Reports:/app/Reports
      - ${ENV_DATA_ROOT}/Snapshots:/app/Snapshots
      - ${ENV_DATA_ROOT}/datasets:/app/datasets
      - ${ENV_DATA_ROOT}/maps:/app/maps
      - ${ENV_DATA_ROOT}/portal-data:/app/data
    ports:
      - "${PORT_PORTAL}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  # Named per environment so two environments never share PostgreSQL storage.
  pgdata:
    name: ${COMPOSE_PROJECT_NAME}-pgdata
