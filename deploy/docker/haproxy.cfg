global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# Embedded Docker DNS Resolver
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold other 5s
    hold refused 5s
    hold valid 5s

# ─── Portal Frontend ──────────────────────────────────────────────────
frontend portal_front
    bind *:5000
    default_backend portal_back

# ─── Orchestrator Frontend ───────────────────────────────────────────────────
frontend orchestrator_front
    bind *:5001
    default_backend orchestrator_back

# ─── Portal Backend (Sticky sessions using ETLSQL_PORTAL_AFFINITY) ─────
backend portal_back
    balance roundrobin
    # Learn the Portal's node cookie without rewriting it. Interactive sessions are node-local.
    stick-table type string len 128 size 10k expire 8h
    stick match req.cook(ETLSQL_PORTAL_AFFINITY)
    stick store-response res.cook(ETLSQL_PORTAL_AFFINITY)
    option httpchk GET /healthz
    http-check expect status 200
    # Dynamically resolve up to 10 portal instances using Docker DNS resolver
    server-template portal- 1-10 portal:5000 check resolvers docker init-addr libc,none

# ─── Orchestrator Backend (Round-robin balancing) ─────────────────────────────
backend orchestrator_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # Orchestrator API routes are stateless (sync'd via Postgres DB). No affinity required.
    server-template orchestrator- 1-10 orchestrator:5001 check resolvers docker init-addr libc,none
