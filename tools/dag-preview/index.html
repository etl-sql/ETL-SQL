<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAG Preview — dev harness</title>

  <!-- Vendored ECharts (same build the portal ships) → renderDag reads window.echarts -->
  <script src="/src/ETL-SQL.ReportPortal/wwwroot/js/echarts.min.js"></script>

  <!-- The DAG's own stylesheet, canonical source (no sync needed) -->
  <link rel="stylesheet" href="/src/ETL-SQL.ReportRuntime/Resources/Shared/designer/designer.css" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    header {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid #1e293b; background: #111827;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .hint { color: #94a3b8; font-size: 12px; }
    header label { color: #cbd5e1; font-size: 13px; }
    select, button {
      background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    }
    .stat { color: #64748b; font-size: 12px; }
    #dag {
      height: calc(100vh - 58px); min-height: 480px; width: 100%;
      background: #0b1220;
    }
    .err { padding: 24px; color: #fca5a5; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <header>
    <h1>DAG Preview</h1>
    <span class="hint">dev-only harness · imports the canonical <code>designer.js</code> · no Docker</span>
    <label>Fixture:
      <select id="fixtureSel">
        <option value="kitchen">Kitchen Sink (~106 nodes)</option>
        <option value="small">Small report (5 nodes)</option>
      </select>
    </label>
    <button id="reloadBtn" title="Re-import designer.js and re-render">↻ Reload</button>
    <span class="stat" id="stat"></span>
  </header>

  <div id="dag"></div>

  <script type="module">
    import { buildKitchenSinkGraph, buildSmallGraph } from './fixture.js';

    const $dag = document.getElementById('dag');
    const $sel = document.getElementById('fixtureSel');
    const $stat = document.getElementById('stat');
    let instance = null;

    async function render() {
      if (instance) { try { instance.dispose(); } catch {} instance = null; }
      $dag.innerHTML = '';

      const graph = $sel.value === 'small' ? buildSmallGraph() : buildKitchenSinkGraph();
      $stat.textContent = `${graph.nodes.length} nodes · ${graph.edges.length} edges`;

      try {
        // Cache-bust so ↻ Reload always pulls the freshest designer.js while editing.
        const mod = await import(`/src/ETL-SQL.ReportRuntime/Resources/Shared/designer/designer.js?t=${Date.now()}`);
        instance = mod.renderDag($dag, graph, { theme: 'portal' });
      } catch (err) {
        const pre = document.createElement('div');
        pre.className = 'err';
        pre.textContent = `Failed to load designer.js:\n${err.stack || err.message}`;
        $dag.replaceChildren(pre);
        console.error(err);
      }
    }

    $sel.addEventListener('change', render);
    document.getElementById('reloadBtn').addEventListener('click', render);
    window.addEventListener('resize', () => instance?.resize?.());

    render();
  </script>
</body>
</html>
