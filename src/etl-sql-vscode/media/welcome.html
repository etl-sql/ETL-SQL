<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ETL-SQL</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--vscode-editor-background);
            color: var(--vscode-foreground);
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            line-height: 1.45;
        }

        button {
            font: inherit;
        }

        .page {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 32px 28px 40px;
        }

        .masthead {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 14px;
            align-items: center;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--vscode-panel-border, var(--vscode-widget-border));
        }

        .mark {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            color: var(--vscode-icon-foreground);
            background: var(--vscode-sideBar-background);
            border: 1px solid var(--vscode-widget-border);
            border-radius: 6px;
        }

        .mark svg {
            width: 24px;
            height: 24px;
        }

        h1 {
            margin: 0;
            color: var(--vscode-foreground);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 3px;
            color: var(--vscode-descriptionForeground);
            max-width: 56ch;
        }

        .content {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(230px, 0.85fr);
            gap: 28px;
            padding-top: 26px;
        }

        section + section {
            margin-top: 28px;
        }

        h2 {
            margin: 0 0 10px;
            color: var(--vscode-sideBarSectionHeader-foreground, var(--vscode-descriptionForeground));
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .action-list,
        .resource-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow: hidden;
            border: 1px solid var(--vscode-widget-border);
            border-radius: 4px;
            background: var(--vscode-list-inactiveSelectionBackground, var(--vscode-sideBar-background));
        }

        .action-item,
        .resource-link {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr) 16px;
            gap: 10px;
            align-items: center;
            width: 100%;
            min-height: 48px;
            padding: 9px 11px;
            color: var(--vscode-foreground);
            text-align: left;
            text-decoration: none;
            background: var(--vscode-sideBar-background);
            border: 0;
            border-radius: 0;
            cursor: pointer;
        }

        .action-item + .action-item,
        .resource-link + .resource-link {
            border-top: 1px solid var(--vscode-widget-border);
        }

        .action-item:hover,
        .resource-link:hover {
            color: var(--vscode-list-hoverForeground, var(--vscode-foreground));
            background: var(--vscode-list-hoverBackground);
        }

        .action-item:focus-visible,
        .resource-link:focus-visible {
            position: relative;
            z-index: 1;
            outline: 1px solid var(--vscode-focusBorder);
            outline-offset: -1px;
        }

        .action-icon,
        .arrow {
            color: var(--vscode-icon-foreground);
        }

        .action-icon {
            display: grid;
            place-items: center;
            width: 24px;
            height: 24px;
        }

        .action-icon svg,
        .arrow svg {
            display: block;
            width: 16px;
            height: 16px;
        }

        .label {
            display: block;
            overflow: hidden;
            color: var(--vscode-foreground);
            font-size: 13px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .description {
            display: block;
            overflow: hidden;
            color: var(--vscode-descriptionForeground);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .resource-link {
            min-height: 38px;
            grid-template-columns: 20px minmax(0, 1fr) 16px;
            padding-block: 8px;
        }

        .resource-link .label {
            font-weight: 400;
        }

        .project-note {
            margin: 10px 0 0;
            color: var(--vscode-descriptionForeground);
            font-size: 12px;
        }

        .primary {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        .primary .label,
        .primary .description,
        .primary .action-icon,
        .primary .arrow {
            color: var(--vscode-button-foreground);
        }

        .primary .description {
            opacity: 0.85;
        }

        .primary:hover {
            background: var(--vscode-button-hoverBackground);
            color: var(--vscode-button-foreground);
        }

        .primary + .action-item {
            border-top-color: color-mix(in srgb, var(--vscode-button-background), var(--vscode-widget-border) 70%);
        }

        @media (max-width: 680px) {
            .page {
                padding: 24px 18px 32px;
            }

            .content {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        @media (max-width: 420px) {
            .masthead {
                grid-template-columns: 1fr;
            }

            .mark {
                display: none;
            }

            .description {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="masthead">
            <div class="mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7.5h6.5l2 2H20"></path>
                    <path d="M4 7.5v9A2.5 2.5 0 0 0 6.5 19h11A2.5 2.5 0 0 0 20 16.5v-7"></path>
                    <path d="M8 13h8"></path>
                    <path d="M8 16h5"></path>
                </svg>
            </div>
            <div>
                <h1>ETL-SQL</h1>
                <div class="subtitle">Unified data orchestration for SQL, NoSQL, and FlatFiles.</div>
            </div>
        </header>

        <div class="content">
            <div>
                <section aria-labelledby="start-heading">
                    <h2 id="start-heading">Start</h2>
                    <div class="action-list">
                        <button class="action-item primary" type="button" onclick="sendCommand('newNotebook')">
                            <span class="action-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 2.5h7A1.5 1.5 0 0 1 12.5 4v9.5h-8A1.5 1.5 0 0 1 3 12V4a1.5 1.5 0 0 1 1-1.42"></path>
                                    <path d="M5.5 2v12"></path>
                                    <path d="M7.5 6h3"></path>
                                    <path d="M7.5 9h2"></path>
                                </svg>
                            </span>
                            <span>
                                <span class="label">New Notebook</span>
                                <span class="description">Iterative data exploration with .etlnb</span>
                            </span>
                            <span class="arrow" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3.5 10.5 8 6 12.5"></path>
                                </svg>
                            </span>
                        </button>

                        <button class="action-item" type="button" onclick="sendCommand('newScript')">
                            <span class="action-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4.5 2.5h5L12 5v8.5h-7.5z"></path>
                                    <path d="M9.5 2.5V5H12"></path>
                                    <path d="M6 8h4"></path>
                                    <path d="M6 10.5h3"></path>
                                </svg>
                            </span>
                            <span>
                                <span class="label">New Script</span>
                                <span class="description">Data pipeline automation with .etlsql</span>
                            </span>
                            <span class="arrow" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3.5 10.5 8 6 12.5"></path>
                                </svg>
                            </span>
                        </button>

                        <button class="action-item" type="button" onclick="sendCommand('newReport')">
                            <span class="action-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 13.5h10"></path>
                                    <path d="M4.5 11V7.5"></path>
                                    <path d="M8 11V4"></path>
                                    <path d="M11.5 11V6"></path>
                                </svg>
                            </span>
                            <span>
                                <span class="label">New Report</span>
                                <span class="description">Interactive dashboards with .rptsql</span>
                            </span>
                            <span class="arrow" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3.5 10.5 8 6 12.5"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                </section>
            </div>

            <aside aria-labelledby="resources-heading">
                <section>
                    <h2 id="resources-heading">Learning &amp; Resources</h2>
                    <nav class="resource-list" aria-label="Learning resources">
                        <button class="resource-link" type="button" onclick="sendCommand('openDocs')">
                            <span class="action-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 3.5h3.5A2.5 2.5 0 0 1 9 6v7a2.5 2.5 0 0 0-2.5-2.5H3z"></path>
                                    <path d="M9 6a2.5 2.5 0 0 1 2.5-2.5H13v7h-1.5A2.5 2.5 0 0 0 9 13"></path>
                                </svg>
                            </span>
                            <span class="label">User Manual</span>
                            <span class="arrow" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3.5 10.5 8 6 12.5"></path>
                                </svg>
                            </span>
                        </button>

                        <button class="resource-link" type="button" onclick="sendCommand('openCookbook')">
                            <span class="action-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 3.5h8v9H4z"></path>
                                    <path d="M6 6h4"></path>
                                    <path d="M6 8h4"></path>
                                    <path d="M6 10h2"></path>
                                </svg>
                            </span>
                            <span class="label">Cookbook</span>
                            <span class="arrow" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3.5 10.5 8 6 12.5"></path>
                                </svg>
                            </span>
                        </button>

                        <button class="resource-link" type="button" onclick="sendCommand('openSamples')">
                            <span class="action-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2.5 5h4l1 1.5h6v6h-11z"></path>
                                    <path d="M2.5 5V3.5h3.25L7 5"></path>
                                </svg>
                            </span>
                            <span class="label">Example Scripts</span>
                            <span class="arrow" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3.5 10.5 8 6 12.5"></path>
                                </svg>
                            </span>
                        </button>

                        <button class="resource-link" type="button" onclick="sendCommand('newNotebook')">
                            <span class="action-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M8 2.5a3.25 3.25 0 0 0-1.75 6v1.25h3.5V8.5A3.25 3.25 0 0 0 8 2.5z"></path>
                                    <path d="M6.75 12h2.5"></path>
                                    <path d="M7.25 13.5h1.5"></path>
                                </svg>
                            </span>
                            <span class="label">Notebook Guide</span>
                            <span class="arrow" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3.5 10.5 8 6 12.5"></path>
                                </svg>
                            </span>
                        </button>

                        <button class="resource-link" type="button" onclick="sendCommand('openNotices')">
                            <span class="action-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 2.5h4.5L12 5v8.5H5z"></path>
                                    <path d="M9.5 2.5V5H12"></path>
                                    <path d="M7 8h3"></path>
                                    <path d="M7 10h3"></path>
                                </svg>
                            </span>
                            <span class="label">Third-party Notices</span>
                            <span class="arrow" aria-hidden="true">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 3.5 10.5 8 6 12.5"></path>
                                </svg>
                            </span>
                        </button>
                    </nav>
                </section>
            </aside>
        </div>
    </main>

    <script>
        const vscode = acquireVsCodeApi();

        function sendCommand(command) {
            vscode.postMessage({ command });
        }
    </script>
</body>
</html>
