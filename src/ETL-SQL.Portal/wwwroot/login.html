<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — ETL-SQL Portal</title>
  <link rel="stylesheet" href="/css/portal.css?v=0.19.0">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1><span class="portal-brand-name">ETL-SQL Portal</span></h1>
    <p class="portal-product-attribution" style="margin-top:-0.4em;font-size:0.8em;opacity:0.6">Octocolee — an ETL-SQL engine</p>
    <p>Sign in to your account</p>

    <div id="errorMsg" class="error-msg"></div>
    <div id="mustChangeBanner" class="must-change-banner" style="display:none">
      Your password is temporary. Please set a new password before continuing.
    </div>

    <!-- Login form -->
    <div id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autofocus>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">

      <button id="loginBtn" class="btn-primary" type="button">Sign In</button>

      <div id="ssoSection" style="display:none">
        <div class="sso-divider">or</div>
        <a id="ssoBtn" class="btn-secondary" href="/api/auth/oidc/login">Sign in with SSO</a>
      </div>
    </div>

    <!-- Change-password form (shown when MustChangePassword=true) -->
    <div id="changeForm" style="display:none">
      <label for="currentPwd">Current Password</label>
      <input id="currentPwd" type="password" autocomplete="current-password">

      <label for="newPwd">New Password</label>
      <input id="newPwd" type="password" autocomplete="new-password">

      <label for="confirmPwd">Confirm Password</label>
      <input id="confirmPwd" type="password" autocomplete="new-password">

      <button id="changeBtn" class="btn-primary" type="button">Set Password</button>
    </div>

  </div>
</div>
<div class="portal-corner-links">
  <span class="portal-brand-footer"></span>
  <a class="portal-legal-link" href="/third-party-notices" target="_blank" rel="noopener">Third-party notices</a>
</div>

<script type="module" src="/js/pages/login.js?v=0.19.0"></script>
</body>
</html>
