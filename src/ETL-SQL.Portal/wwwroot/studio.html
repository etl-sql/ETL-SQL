<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETL-SQL Studio — Portal</title>
  <link rel="stylesheet" href="/css/portal.css?v=0.18.0">
  <link rel="stylesheet" href="/designer/designer.css?v=0.18.0">
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; height: 100vh; }
    .app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #studioHost { flex: 1; overflow: hidden; position: relative; }
  </style>
</head>
<body>
<div class="app-shell">
  <!-- ── Top bar ────────────────────────────────────────────────────────── -->
  <header data-portal-header data-active="studio" data-logout-hidden="true"></header>

  <div id="studioHost"></div>
</div>

<script src="/js/feedback.js?v=0.18.0"></script>
<script type="module">
import { auth, authApi, studioApi } from '/js/api.js?v=0.18.0';
import { applyPortalBranding, initTheme } from '/js/branding.js?v=0.18.0';
import { getSessionIdentity, renderSessionIdentity } from '/js/session-identity.js?v=0.18.0';
import { applyNavigationSafely } from '/js/portal-nav.js?v=0.18.0';
import { createStudioWorkbench } from '/designer/studio.js?v=0.18.0';
import { renderPortalHeader } from '/js/portal-header.js?v=0.18.0';

renderPortalHeader();
if (!auth.isLoggedIn()) { window.location.href = '/login.html'; }
initTheme();
applyPortalBranding();

const identity = getSessionIdentity(auth.getToken());
renderSessionIdentity(identity, document.getElementById('topbarUser'));

const logoutBtn = document.getElementById('logoutBtn');
if (logoutBtn) {
  logoutBtn.style.display = 'inline-block';
  logoutBtn.addEventListener('click', () => authApi.logout());
}

applyNavigationSafely();

const params = new URLSearchParams(window.location.search);
const container = document.getElementById('studioHost');

async function authFetch(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${auth.getToken()}` }
  });
  if (res.status === 401) { auth.redirectToLogin(); return null; }
  return res;
}

const sampleReport = `CREATE CONNECTION corp_db AS MSSQL('SHARED:corp_sales_gw');

CREATE DATASET ds_orders AS 
  SELECT order_date, total_amount, region 
  FROM corp_db.orders
  WHERE status = 'Completed';

PAGE "Executive Overview" {
    CONTAINER row {
        VISUAL rev_kpi TYPE 'KPI' MAPPINGS (VALUE = SUM(total_amount)) OPTIONS (TITLE = 'Total Revenue');
        VISUAL order_bar TYPE 'BAR' MAPPINGS (X = region, Y = SUM(total_amount)) OPTIONS (TITLE = 'Sales by Region');
    }
}`;

const sampleEtl = `CREATE CONNECTION staging_db AS POSTGRES(
  HOST = '127.0.0.1',
  DATABASE = 'staging',
  USER = 'SECRET:db_user',
  PASSWORD = 'SECRET:db_pass'
);

-- 1. Extract raw sales into engine memory
SELECT id, product_id, quantity, amount, sale_date
INTO #raw_sales
FROM staging_db.sales_orders
WHERE sale_date >= DATEADD(DAY, -7, GETDATE());

-- 2. Validate clean non-null amounts
UPDATE #raw_sales SET amount = 0 WHERE amount IS NULL;

PRINT 'Staging extract & clean complete.';`;

const docs = [
  {
    id: 'doc-report',
    path: 'reports/sales_overview.rptsql',
    name: 'sales_overview.rptsql',
    content: sampleReport,
    isDirty: false,
    projection: 'split'
  },
  {
    id: 'doc-etl',
    path: 'etl/ingest_orders.etlsql',
    name: 'ingest_orders.etlsql',
    content: sampleEtl,
    isDirty: false,
    projection: 'split'
  }
];

window.__STUDIO__ = await createStudioWorkbench(container, {
  documents: docs,
  authFetch,
  apiBase: '',
  onSave: async (content, filePath) => {
    try {
      const res = await authFetch('/api/designer/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: filePath, script: content })
      });
      if (res && res.ok) {
        ETLSQLFeedback?.notify?.('Saved ' + filePath, { title: 'Saved to Portal', tone: 'success' });
      }
    } catch (e) {
      ETLSQLFeedback?.notify?.('Save failed: ' + e.message, { title: 'Save Failed', tone: 'error' });
    }
  }
});
</script>
</body>
</html>
