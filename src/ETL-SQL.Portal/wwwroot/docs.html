<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETL-SQL Documentation</title>
  <link rel="stylesheet" href="/css/portal.css?v=0.15.0">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17212b; background: #f7f8fa; }
    .docs-shell { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height: 100vh; }
    .docs-sidebar { border-right: 1px solid #d9dee5; background: #fff; padding: 18px; overflow: auto; }
    .docs-sidebar h1 { font-size: 20px; margin: 0 0 14px; }
    .docs-search { width: 100%; box-sizing: border-box; border: 1px solid #b9c1cc; border-radius: 6px; padding: 10px 12px; font-size: 14px; }
    .docs-list { display: grid; gap: 8px; margin-top: 16px; }
    .docs-result { border: 1px solid #d9dee5; background: #fff; border-radius: 6px; padding: 10px; text-align: left; cursor: pointer; }
    .docs-result:hover, .docs-result.active { border-color: #2d6cdf; background: #f3f7ff; }
    .docs-result-title { font-weight: 650; font-size: 14px; line-height: 1.25; }
    .docs-result-meta { color: #5e6b78; font-size: 12px; margin-top: 3px; }
    .docs-main { padding: 26px clamp(20px, 5vw, 64px); overflow: auto; }
    .docs-main article { max-width: 980px; background: #fff; border: 1px solid #d9dee5; border-radius: 8px; padding: 28px; }
    .docs-main h1, .docs-main h2, .docs-main h3 { line-height: 1.2; }
    .docs-main pre { overflow: auto; background: #111827; color: #f8fafc; padding: 14px; border-radius: 6px; }
    .docs-main code { background: #eef2f6; padding: 1px 4px; border-radius: 4px; }
    .docs-main pre code { background: transparent; padding: 0; }
    .docs-empty { color: #5e6b78; }
    @media (max-width: 800px) {
      .docs-shell { grid-template-columns: 1fr; }
      .docs-sidebar { border-right: 0; border-bottom: 1px solid #d9dee5; max-height: 45vh; }
      .docs-main { padding: 16px; }
      .docs-main article { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="docs-shell">
    <aside class="docs-sidebar">
      <h1>ETL-SQL Docs</h1>
      <input id="search" class="docs-search" type="search" placeholder="Search documentation" autocomplete="off">
      <div id="results" class="docs-list"></div>
    </aside>
    <main class="docs-main">
      <article id="document">
        <p class="docs-empty">Select a document or search the library.</p>
      </article>
    </main>
  </div>
  <script src="/js/docs.js?v=0.15.0"></script>
</body>
</html>
