<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation — ETL-SQL Portal</title>
  <link rel="stylesheet" href="/css/portal.css?v=0.16.0">
  <style>
    .docs-article {
      max-width: 960px;
      line-height: 1.6;
      color: var(--portal-text);
    }
    .docs-article h1 { font-size: 1.75em; margin: 0 0 12px; color: var(--portal-text); border-bottom: 1px solid var(--portal-border-soft); padding-bottom: 8px; }
    .docs-article h2 { font-size: 1.35em; margin: 24px 0 10px; color: var(--portal-text); }
    .docs-article h3 { font-size: 1.1em; margin: 18px 0 8px; color: var(--portal-text); }
    .docs-article p { margin: 0 0 14px; color: var(--portal-text-soft); }
    .docs-article ul, .docs-article ol { margin: 0 0 14px; padding-left: 24px; color: var(--portal-text-soft); }
    .docs-article li { margin-bottom: 4px; }
    .docs-article pre {
      background: var(--portal-bg-soft);
      border: 1px solid var(--portal-border-soft);
      border-radius: var(--portal-radius-sm);
      padding: 14px 16px;
      overflow-x: auto;
      font-family: var(--portal-font-mono, monospace);
      font-size: .9em;
      color: var(--portal-text);
      margin: 0 0 16px;
    }
    .docs-article code {
      background: var(--portal-bg-soft);
      color: var(--portal-accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .88em;
      font-family: var(--portal-font-mono, monospace);
    }
    .docs-article pre code { background: transparent; padding: 0; color: inherit; }
    .docs-article blockquote {
      margin: 0 0 16px;
      padding: 10px 16px;
      border-left: 4px solid var(--portal-accent);
      background: var(--portal-accent-soft);
      border-radius: 0 var(--portal-radius-sm) var(--portal-radius-sm) 0;
      color: var(--portal-text);
    }
    .docs-article blockquote p { margin: 0; color: inherit; }
    .docs-empty { color: var(--portal-text-soft); font-size: .95em; }
    .docs-item-section { font-size: .72em; text-transform: uppercase; letter-spacing: .05em; color: var(--portal-muted); margin-top: 2px; }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- ── Top bar ────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation menu">☰</button>
    <span class="topbar-brand"><span class="brand-mark">E</span> <span class="portal-brand-name">ETL-SQL Portal</span></span>
    <nav class="topbar-nav">
      <a href="/index.html">Reports</a>
      <a href="/docs.html" class="active">Docs</a>
      <a href="/orchestrator.html" id="orchestratorNav" style="display:none">Orchestrator</a>
      <a href="/admin.html" id="adminNav" style="display:none">Admin</a>
    </nav>
    <span class="topbar-spacer"></span>
    <span class="topbar-user" id="topbarUser"></span>
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark mode" type="button">🌓</button>
    <button class="topbar-btn" id="logoutBtn" style="display:none">Sign Out</button>
  </header>

  <!-- ── App body ────────────────────────────────────────────────────────── -->
  <div class="app-body">
    <!-- Sidebar: Dictionary & Documentation tree -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-hdr">
        <span>Help & Dictionary</span>
        <span class="sidebar-hint">Language Reference</span>
      </div>

      <div style="padding: 10px 8px; border-bottom: 1px solid var(--portal-border-soft);">
        <input id="search" class="form-control" type="search" placeholder="Search dictionary (e.g. SELECT, BAR, CAST)..." autocomplete="off" style="width:100%; box-sizing:border-box;">
      </div>

      <div class="sidebar-nav" id="categoryNav" aria-label="Documentation categories" style="flex-wrap: wrap; flex-direction: row; gap: 4px; padding: 8px;">
        <button class="btn btn-sm btn-outline active" data-section="All">All</button>
        <button class="btn btn-sm btn-outline" data-section="Keywords">Keywords</button>
        <button class="btn btn-sm btn-outline" data-section="Visuals">Visuals</button>
        <button class="btn btn-sm btn-outline" data-section="Functions">Functions</button>
        <button class="btn btn-sm btn-outline" data-section="Connectors">Connectors</button>
        <button class="btn btn-sm btn-outline" data-section="Report-SQL">Report-SQL</button>
      </div>

      <div class="sidebar-tree" id="results" role="tree" aria-label="Documentation topics">
        <div class="loading-state loading-state-compact">Loading dictionary…</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent" style="padding: 24px 32px; overflow-y: auto;">
      <article id="document" class="card docs-article" style="margin: 0 auto; padding: 32px;">
        <p class="docs-empty">Select a documentation topic or search the dictionary.</p>
      </article>
    </main>
  </div>
</div>

<div class="portal-corner-links">
  <span class="portal-brand-footer"></span>
  <a class="portal-legal-link" href="/third-party-notices" target="_blank" rel="noopener">Third-party notices</a>
</div>

<script type="module">
  import { auth } from '/js/api.js?v=0.16.0';
  import { applyPortalBranding, initTheme } from '/js/branding.js?v=0.16.0';

  initTheme();
  applyPortalBranding();

  if (auth.isLoggedIn()) {
    const user = auth.getUser();
    const userEl = document.getElementById('topbarUser');
    if (userEl && user) userEl.textContent = user.username || user.name || '';

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.style.display = 'inline-block';
      logoutBtn.addEventListener('click', () => auth.logout());
    }

    if (auth.hasRole('Admin')) {
      const adminNav = document.getElementById('adminNav');
      if (adminNav) adminNav.style.display = 'inline-block';
      const orchNav = document.getElementById('orchestratorNav');
      if (orchNav) orchNav.style.display = 'inline-block';
    }
  }
</script>
<script src="/js/docs.js?v=0.16.0"></script>
</body>
</html>
