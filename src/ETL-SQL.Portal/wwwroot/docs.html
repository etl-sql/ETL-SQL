<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation — ETL-SQL Portal</title>
  <link rel="stylesheet" href="/css/portal.css?v=0.17.0">
  <style>
    html, body { margin: 0; padding: 0; background: var(--portal-bg); color: var(--portal-text); font-family: var(--portal-font); }
    .docs-body { padding: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .docs-shell { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; flex: 1; height: calc(100vh - 48px); overflow: hidden; }
    .docs-sidebar { border-right: 1px solid var(--portal-border); background: var(--portal-surface); padding: 18px; overflow: auto; }
    .docs-sidebar h1 { font-size: 20px; margin: 0 0 14px; color: var(--portal-text); }
    .docs-search { width: 100%; box-sizing: border-box; border: 1px solid var(--portal-border); background: var(--portal-surface-subtle); color: var(--portal-text); border-radius: var(--portal-radius-sm); padding: 10px 12px; font-size: 14px; }
    .docs-search:focus { outline: none; border-color: var(--portal-accent); box-shadow: 0 0 0 2px var(--portal-focus); }
    .docs-list { display: grid; gap: 8px; margin-top: 16px; }
    .docs-result { border: 1px solid var(--portal-border-soft); background: var(--portal-surface); border-radius: var(--portal-radius-sm); padding: 10px; text-align: left; cursor: pointer; color: var(--portal-text); transition: background .15s ease, border-color .15s ease; }
    .docs-result:hover, .docs-result.active { border-color: var(--portal-accent); background: var(--portal-accent-soft); }
    .docs-result-title { font-weight: 650; font-size: 14px; line-height: 1.25; color: var(--portal-text); }
    .docs-result-meta { color: var(--portal-text-soft); font-size: 12px; margin-top: 3px; }
    .docs-main { padding: 26px clamp(20px, 5vw, 64px); overflow: auto; background: var(--portal-bg); }
    .docs-main article { max-width: 980px; background: var(--portal-surface); border: 1px solid var(--portal-border); border-radius: var(--portal-radius); padding: 28px; color: var(--portal-text); }
    .docs-main h1, .docs-main h2, .docs-main h3 { line-height: 1.2; color: var(--portal-text); }
    .docs-main pre { overflow: auto; background: var(--portal-bg-soft); color: var(--portal-text); padding: 14px; border-radius: var(--portal-radius-sm); border: 1px solid var(--portal-border-soft); }
    .docs-main code { background: var(--portal-bg-soft); padding: 1px 4px; border-radius: 4px; color: var(--portal-accent); }
    .docs-main pre code { background: transparent; padding: 0; color: inherit; }
    .docs-empty { color: var(--portal-text-soft); }
    @media (max-width: 800px) {
      .docs-shell { grid-template-columns: 1fr; height: auto; overflow: visible; }
      .docs-sidebar { border-right: 0; border-bottom: 1px solid var(--portal-border); max-height: 45vh; }
      .docs-main { padding: 16px; }
      .docs-main article { padding: 18px; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- ── Top bar ────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <span class="topbar-brand"><span class="brand-mark">E</span> <span class="portal-brand-name">ETL-SQL Portal</span></span>
    <nav class="topbar-nav">
      <a href="/index.html">Reports</a>
      <a href="/orchestrator.html" id="orchestratorNav" style="display:none">Orchestrator</a>
      <a href="/admin.html" id="adminNav" style="display:none">Admin</a>
      <a href="/docs.html" class="active">Docs</a>
    </nav>
    <span class="topbar-spacer"></span>
    <span class="topbar-user" id="topbarUser"></span>
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark mode" type="button">🌓</button>
    <button class="topbar-btn" id="logoutBtn" style="display:none">Sign Out</button>
  </header>

  <!-- ── App body ────────────────────────────────────────────────────────── -->
  <div class="app-body docs-body">
    <div class="docs-shell">
      <aside class="docs-sidebar">
        <h1>ETL-SQL Docs</h1>
        <input id="search" class="docs-search" type="search" placeholder="Search documentation" autocomplete="off">
        <div id="results" class="docs-list"></div>
      </aside>
      <main class="docs-main">
        <article id="document">
          <p class="docs-empty">Select a document or search the library.</p>
        </article>
      </main>
    </div>
  </div>
</div>

<script type="module">
  import { auth } from '/js/api.js?v=0.17.0';
  import { applyPortalBranding, initTheme } from '/js/branding.js?v=0.17.0';

  initTheme();
  applyPortalBranding();

  if (auth.isLoggedIn()) {
    const user = auth.getUser();
    const userEl = document.getElementById('topbarUser');
    if (userEl && user) userEl.textContent = user.username || user.name || '';

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.style.display = 'inline-block';
      logoutBtn.addEventListener('click', () => auth.logout());
    }

    if (auth.hasRole('Admin')) {
      const adminNav = document.getElementById('adminNav');
      if (adminNav) adminNav.style.display = 'inline-block';
      const orchNav = document.getElementById('orchestratorNav');
      if (orchNav) orchNav.style.display = 'inline-block';
    }
  }
</script>
<script src="/js/docs.js?v=0.17.0"></script>
</body>
</html>
