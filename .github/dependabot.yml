version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/src/etl-sql-vscode"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/src/etl-sql-vscode/ui"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/scripts/typecheck"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/scripts/lint"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/scripts/codemirror"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/scripts/vsix"
    schedule:
      interval: "weekly"
