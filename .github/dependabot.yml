version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0 # paused for the v0.21.0 release window; remove after release

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0 # paused for the v0.21.0 release window; remove after release

  - package-ecosystem: "npm"
    directory: "/src/etl-sql-vscode"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0 # paused for the v0.21.0 release window; remove after release

  - package-ecosystem: "npm"
    directory: "/src/etl-sql-vscode/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0 # paused for the v0.21.0 release window; remove after release

