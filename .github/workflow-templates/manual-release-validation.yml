name: Manual Release Validation

on:
  workflow_dispatch:

jobs:
  validate:
    name: Smoke, Fast, Coverage
    runs-on: windows-latest

    steps:
      - name: Checkout
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
          git checkout --force FETCH_HEAD

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore ETL-SQL.slnx

      - name: Check shared report runtime assets
        shell: pwsh
        run: node .\scripts\sync-assets.js -Check

      - name: Build
        run: dotnet build ETL-SQL.slnx --no-restore --configuration Release

      - name: Audit test lanes and structure
        shell: pwsh
        run: .\scripts\Get-TestLaneInventory.ps1 -FailOnIssues

      - name: Smoke lane
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane smoke -Configuration Release -NoRestore -NoBuild

      - name: Engine lane with coverage gate
        shell: pwsh
        run: .\scripts\Test-CoverageGate.ps1 -RunEngineLane -Configuration Release -NoRestore -NoBuild -CoverageDirectory coverage -MinimumLineCoverage 70
