name: Release Certification

# Register the manual entry point while its implementation is certified on release branches.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA on the selected release branch
        required: true
        type: string

permissions: {}

jobs:
  select-release-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the release branch implementation
        run: |
          echo '::error::Select the matching release branch when dispatching this workflow. The default branch only registers this entry point.'
          exit 1
