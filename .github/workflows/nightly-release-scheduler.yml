name: Schedule Active Release Checks

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-release-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Discover unreleased version branches and request checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-nightly-release.mjs
