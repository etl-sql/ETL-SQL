name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 6' # Weekly scan on Saturday evenings

jobs:
  analyze:
    name: Analyze
    timeout-minutes: 45
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      timeout-minutes: 15
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'

    - name: Install browser compiler
      timeout-minutes: 10
      run: npm ci --prefix scripts/typecheck

    - name: Prepare browser assets
      timeout-minutes: 10
      run: node scripts/sync-assets.js

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        config: |
          paths-ignore:
            - '**/tests/**'
            - '**/tools/ui-sandbox/**'
            - '**/out/**'
            - '**/dist/**'
            - '**/wwwroot/js/**'
            - '**/wwwroot/css/**'
            # Build and package generators process paths and archives; analyse them too.
            - '**/scripts/checks/**'
            - '**/scripts/fixtures/**'
            - '**/*.bundle.js'
            - '**/src/ETL-SQL.ReportPlayer/wwwroot/**'
            - '**/src/ETL-SQL.WorkstationEditor/wwwroot/**'
            - '**/src/etl-sql-vscode/media/**'
            # Generated outputs, vendor bundles and map data only. The authored implementation is
            # Resources/TypeScript and BrowserSources, which must stay analysed:
            # scripts/checks/test-source-analysis-coverage.mjs fails if a rule here hides an owner.
            - '**/src/ETL-SQL.ReportRuntime/Resources/Shared/**'
            - '**/src/ETL-SQL.Portal/wwwroot/designer/**'
            # WiX/Windows Installer custom-action scripts are WSH JScript (e.g. Session.Property(x)=v,
            # ActiveXObject), not standard ECMAScript — the CodeQL JS extractor cannot parse them.
            - '**/src/ETL-SQL.Installer/*.js'
          query-filters:
            - exclude:
                id:
                  - cs/log-forging
                  - cs/user-controlled-bypass
                  - js/remote-property-injection
                  - cs/exposure-of-sensitive-information
                  - cs/cleartext-storage-of-sensitive-information
                  - js/insecure-temporary-file
                  - js/missing-origin-check
                  - js/client-side-request-forgery
                  - js/client-side-unvalidated-url-redirection
                  - js/file-access-to-http
                  - js/http-to-file-access
                  - js/regex/missing-regexp-anchor
        queries: security-extended

    # Explicitly compile only production entry points (skips compiling any test projects)
    - name: Build Production Code
      timeout-minutes: 30
      if: matrix.language == 'csharp'
      run: |
        dotnet build src/ETL-SQL.App/ETL-SQL.App.csproj --configuration Release
        dotnet build src/ETL-SQL.Portal/ETL-SQL.Portal.csproj --configuration Release
        dotnet build src/ETL-SQL.Orchestrator.Service/ETL-SQL.Orchestrator.Service.csproj --configuration Release
        dotnet build src/ETL-SQL.TUI/ETL-SQL.TUI.csproj --configuration Release

    # JS/TS does not need compilation, so we run a dummy step for non-csharp matrix options
    - name: Autobuild non-compiled languages
      if: matrix.language != 'csharp'
      uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
