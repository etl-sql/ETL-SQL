name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 18 * * 6' # Weekly scan on Saturday evenings

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.37.9
      with:
        languages: ${{ matrix.language }}
        config: |
          paths-ignore:
            - '**/tests/**'
            - '**/tools/ui-sandbox/**'
            - '**/out/**'
            - '**/dist/**'
            - '**/wwwroot/js/**'
            - '**/wwwroot/css/**'
            - '**/scripts/**'
            - '**/src/ETL-SQL.ReportPlayer/wwwroot/report-runtime.js'
            - '**/src/etl-sql-vscode/media/report-runtime.js'
            # WiX/Windows Installer custom-action scripts are WSH JScript (e.g. Session.Property(x)=v,
            # ActiveXObject), not standard ECMAScript — the CodeQL JS extractor cannot parse them.
            - '**/src/ETL-SQL.Installer/*.js'
          query-filters:
            - exclude:
                id:
                  - cs/log-forging
                  - js/remote-property-injection
                  - cs/exposure-of-sensitive-information
                  - cs/cleartext-storage-of-sensitive-information
                  - js/insecure-temporary-file
                  - js/missing-origin-check
                  - js/client-side-request-forgery
                  - js/file-access-to-http
                  - js/http-to-file-access
                  - js/regex/missing-regexp-anchor
        queries: security-extended

    # Explicitly compile only production entry points (skips compiling any test projects)
    - name: Build Production Code
      if: matrix.language == 'csharp'
      run: |
        dotnet build src/ETL-SQL.App/ETL-SQL.App.csproj --configuration Release
        dotnet build src/ETL-SQL.Portal/ETL-SQL.Portal.csproj --configuration Release
        dotnet build src/ETL-SQL.Orchestrator.Service/ETL-SQL.Orchestrator.Service.csproj --configuration Release
        dotnet build src/ETL-SQL.TUI/ETL-SQL.TUI.csproj --configuration Release

    # JS/TS does not need compilation, so we run a dummy step for non-csharp matrix options
    - name: Autobuild non-compiled languages
      if: matrix.language != 'csharp'
      uses: github/codeql-action/autobuild@v4.37.9

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.37.9
