name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 18 * * 6' # Weekly scan on Saturday evenings

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config: |
          paths-ignore:
            - '**/tests/**'
            - '**/tools/ui-sandbox/**'
            - '**/out/**'
            - '**/dist/**'
            - '**/wwwroot/js/**'
            - '**/wwwroot/css/**'
            - '**/scripts/**'
            - '**/src/ETL-SQL.ReportPlayer/wwwroot/report-runtime.js'
            - '**/src/etl-sql-vscode/media/report-runtime.js'
          query-filters:
            - exclude:
                id:
                  - cs/log-forging
                  - js/remote-property-injection
        queries: security-extended

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
