name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:
    inputs:
      lanes:
        description: Comma-separated diagnostic lane IDs; blank selects all. Never release evidence.
        type: string
        default: ''
  workflow_call:
    inputs:
      release_certification:
        type: boolean
        default: false
      candidate_sha:
        type: string
        required: true

permissions:
  contents: read

# New branch/PR revisions replace obsolete validation. Event and full ref keep independent
# branches and push/PR runs separate; immutable Release/MSI certification uses other workflows.
concurrency:
  group: ci-execution-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release_certification }}

jobs:
  source-preflight:
    name: Source preflight
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.impact.outputs.lanes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Event values are passed as data, never interpolated into shell source.
      - name: Select affected lanes or full certification
        id: impact
        shell: pwsh
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMPACT_COMPARISON: ${{ github.event_name == 'pull_request' && 'merge-base' || 'direct' }}
          FULL_CERTIFICATION: ${{ inputs.release_certification }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DIAGNOSTIC_LANES: ${{ inputs.lanes }}
        run: |
          $arguments = @('--head', $env:GITHUB_SHA, '--output', 'release-validation/preflight/ci-impact.json')
          if ($env:FULL_CERTIFICATION -eq 'true') {
            if ($env:CANDIDATE_SHA -cne $env:GITHUB_SHA) { throw 'Release branch moved away from the requested candidate.' }
            $arguments += @('--base', $env:GITHUB_SHA, '--full')
          } elseif ($env:DIAGNOSTIC_LANES) {
            $arguments += @('--base', $env:GITHUB_SHA, '--lanes', $env:DIAGNOSTIC_LANES)
          } elseif ($env:IMPACT_BASE) {
            $arguments += @('--base', $env:IMPACT_BASE, '--comparison', $env:IMPACT_COMPARISON)
          }
          node scripts/select-ci-lanes.mjs @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selection = Get-Content release-validation/preflight/ci-impact.json -Raw | ConvertFrom-Json
          "lanes=$($selection.lanes | ConvertTo-Json -Compress -AsArray)" >> $env:GITHUB_OUTPUT
      - name: Prepare pinned workflow checker
        run: node scripts/setup-actionlint.mjs
      - name: Collect source findings
        run: node scripts/release-preflight.mjs
      - name: Upload preflight logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-validation/preflight/
          if-no-files-found: error
          retention-days: 30

  build-and-test:
    needs: source-preflight
    if: contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'build-and-test')
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up browser compiler runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck

      - name: Prepare browser assets
        run: node scripts/sync-assets.js

      - name: Verify .NET
        run: dotnet --info

      - name: Verify Node.js
        run: node --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        shell: pwsh
        timeout-minutes: 12
        run: ./scripts/Invoke-CertificationProcess.ps1 -Command dotnet -CommandArguments @('restore', 'ETL-SQL.slnx') -EvidenceDirectory release-validation/build/restore -TimeoutSeconds 600

      - name: Audit NuGet packages for known vulnerabilities
        shell: pwsh
        run: .\scripts\Test-VulnerablePackages.ps1

      - name: Verify formatting
        shell: pwsh
        timeout-minutes: 12
        run: ./scripts/Invoke-CertificationProcess.ps1 -Command dotnet -CommandArguments @('format', 'ETL-SQL.slnx', '--verify-no-changes', '--no-restore') -EvidenceDirectory release-validation/build/format -TimeoutSeconds 600

      - name: Build
        shell: pwsh
        timeout-minutes: 17
        run: ./scripts/Invoke-CertificationProcess.ps1 -Command dotnet -CommandArguments @('build', 'ETL-SQL.slnx', '--no-restore', '--configuration', 'Release') -EvidenceDirectory release-validation/build/compile -TimeoutSeconds 900

      - name: Verify generated browser contracts against registered hosts
        run: dotnet test tests/ETL-SQL.Portal.Tests/ETL-SQL.Portal.Tests.csproj --no-restore --no-build --configuration Release --filter FullyQualifiedName~BrowserContractsGeneratorTests

      - name: Run fast test lanes (Pull Requests)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane fast -Configuration Release -NoRestore -NoBuild

      - name: Run release smoke tests using the existing build
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane smoke -Configuration Release -NoRestore -NoBuild

      - name: Run engine tests and enforce coverage (Main & Release Push)
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 42
        run: ./scripts/Invoke-CertificationProcess.ps1 -ScriptPath scripts/Test-CoverageGate.ps1 -ScriptArguments @('-RunEngineLane', '-Configuration', 'Release', '-NoRestore', '-NoBuild', '-CoverageDirectory', 'coverage', '-MinimumLineCoverage', '70') -EvidenceDirectory release-validation/build/coverage -TimeoutSeconds 2400

      - name: Print coverage summary
        if: github.event_name != 'pull_request'
        run: cat ./coverage/report/Summary.txt
        shell: bash

      - name: Retain build and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-validation/build/
            coverage/
          if-no-files-found: warn
          retention-days: 30

  browser-consumer-contracts:
    needs: source-preflight
    if: contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'build-and-test')
    name: Browser and Consumer Contracts
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck
      - name: Prepare browser assets
        run: node scripts/sync-assets.js

      # Deletes every inventoried output and both manifests, prepares again, and requires identical
      # bytes. A checkout that still tracks its outputs proves nothing about a tree without them.
      - name: Prove source-only browser asset preparation
        run: node scripts/verify-source-only-preparation.mjs --evidence artifacts/browser-assets-source-only.json

      - name: Upload browser asset ownership and hashes
        uses: actions/upload-artifact@v7
        with:
          name: browser-asset-ownership
          path: |
            artifacts/browser-assets.json
            artifacts/browser-assets-source-only.json
          if-no-files-found: error
          retention-days: 30

      - name: Check shared report runtime assets
        shell: pwsh
        run: node .\scripts\sync-assets.js -Check

      - name: Check browser asset ownership against the Git index
        run: node scripts/browser-asset-ownership.mjs --check

      - name: Check browser-side types
        run: node scripts/typecheck-browser.mjs

      - name: Install browser lint-gate toolchain
        run: npm ci --prefix scripts/lint

      - name: Install unsigned VSIX verification toolchain
        working-directory: scripts/vsix
        run: npm ci

      - name: Audit browser toolchain packages for known vulnerabilities
        shell: pwsh
        run: |
          foreach ($root in @('scripts/typecheck', 'scripts/lint', 'scripts/codemirror', 'scripts/vsix')) {
            npm audit --prefix $root
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Lint the browser sources
        run: node scripts/lint-browser.mjs

      - name: Run browser and consumer contract checks
        run: node scripts/check-consumer-contracts.mjs --exclude-preflight

      - name: Retain consumer contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-validation/consumer-contracts/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify prepared assets after consumer checks
        run: node scripts/sync-assets.js -Check

      # The independent engine coverage lane already executes the HA manifest and CLI .NET tests.
      - name: Validate HA soak harness contracts
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 12
        run: ./scripts/Invoke-CertificationProcess.ps1 -ScriptPath scripts/Test-HaSoakContracts.ps1 -ScriptArguments @('-NoDotNet') -EvidenceDirectory release-validation/ha-contracts -TimeoutSeconds 600

      - name: Retain HA contract diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ha-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-validation/ha-contracts/
          if-no-files-found: warn
          retention-days: 30


  build-vscode:
    needs: source-preflight
    if: contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'build-vscode')
    name: Build VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up browser compiler runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck

      - name: Prepare browser assets
        run: node scripts/sync-assets.js

      - name: Verify .NET
        run: dotnet --info

      - name: Build engine for integration tests
        run: dotnet build src/ETL-SQL.App/ETL-SQL.App.csproj --configuration Debug

      - name: Verify Node.js
        run: node --version

      - name: Install dependencies
        working-directory: src/etl-sql-vscode
        run: npm ci

      - name: Install UI dependencies
        working-directory: src/etl-sql-vscode/ui
        run: npm ci

      - name: Audit npm packages for known vulnerabilities
        working-directory: src/etl-sql-vscode
        run: npm audit

      - name: Audit UI npm packages for known vulnerabilities
        working-directory: src/etl-sql-vscode/ui
        run: npm audit

      - name: Compile extension
        working-directory: src/etl-sql-vscode
        run: npm run compile

      - name: Lint extension
        working-directory: src/etl-sql-vscode
        run: npm run lint

      - name: Lint UI package
        working-directory: src/etl-sql-vscode/ui
        run: npm run lint

      - name: Build UI package
        working-directory: src/etl-sql-vscode/ui
        run: npm run build

      - name: Run UI vitest
        working-directory: src/etl-sql-vscode/ui
        run: npm run test:unit

      - name: Run vitest
        working-directory: src/etl-sql-vscode
        run: npm run test:unit

  sample-scripts:
    needs: source-preflight
    if: contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'sample-scripts')
    name: Sample Scripts (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up browser compiler runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck

      - name: Prepare browser assets
        run: node scripts/sync-assets.js

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore application
        run: dotnet restore src/ETL-SQL.App/ETL-SQL.App.csproj

      - name: Build application
        run: dotnet build src/ETL-SQL.App/ETL-SQL.App.csproj --configuration Debug --no-restore

      - name: Validate samples (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: .\scripts\Test-AllSamples.ps1 -Passes 2

      - name: Validate samples (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PASSES="${{ github.event_name == 'pull_request' && '1' || '2' }}"
          bash ./scripts/test-all-samples.sh "$PASSES"

  portal-browser-journey:
    needs: source-preflight
    if: contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'portal-browser-journey')
    name: Portal Browser Journey (${{ matrix.shard }}/3)
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # windows-latest matches the platform the lane is developed and validated on, and the Portal's
    # own build-and-test job. Kept separate from that job so a browser flake never blocks the
    # coverage gate, and so the ~113 MB Chromium download is cached independently.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up browser compiler runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck

      - name: Prepare browser assets
        run: node scripts/sync-assets.js

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore VS Code UI dependencies
        working-directory: src/etl-sql-vscode/ui
        run: npm ci

      - name: Build VS Code UI package
        working-directory: src/etl-sql-vscode/ui
        run: npm run build

      # Keyed on the Microsoft.Playwright version in Directory.Packages.props: bumping the package
      # must fetch a matching browser build rather than reuse the previous one.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-windows-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: playwright-windows-

      - name: Build browser lane
        run: dotnet build tests/ETL-SQL.Portal.BrowserTests/ETL-SQL.Portal.BrowserTests.csproj --configuration Release

      - name: Run browser lane
        timeout-minutes: 35
        shell: pwsh
        run: |
          ./scripts/Invoke-CertificationProcess.ps1 `
            -ScriptPath ./scripts/Test-BrowserShard.ps1 `
            -ScriptArguments @('-Shard', '${{ matrix.shard }}', '-ShardCount', '3', '-Configuration', 'Release', '-NoBuild', '-EvidenceDirectory', 'artifacts/browser-shard') `
            -EvidenceDirectory artifacts/browser-shard/supervisor `
            -TimeoutSeconds 1800

      - name: Retain browser shard diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-shard/
          if-no-files-found: error
          retention-days: 30

  portal-browser-gate:
    name: Portal Browser Journey
    needs: [source-preflight, portal-browser-journey]
    if: always() && needs.source-preflight.result == 'success' && contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'portal-browser-journey')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require all browser jobs to pass
        env:
          SHARD_RESULT: ${{ needs.portal-browser-journey.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-shard-*-${{ github.run_id }}-*
          path: browser-evidence
      - name: Verify complete nonoverlapping browser coverage
        run: node scripts/verify-browser-shards.mjs browser-evidence "$GITHUB_RUN_ID" 3

  studio-performance-budgets:
    needs: source-preflight
    if: contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'studio-performance-budgets')
    name: Studio Performance Budgets (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up browser compiler runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck

      - name: Prepare browser assets
        run: node scripts/sync-assets.js

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-chromium-${{ matrix.platform }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: playwright-chromium-${{ matrix.platform }}-

      - name: Build Studio performance gate
        run: dotnet build tests/ETL-SQL.Portal.BrowserTests/ETL-SQL.Portal.BrowserTests.csproj --configuration Release

      - name: Measure Studio performance
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        shell: pwsh
        run: >-
          ./scripts/Measure-StudioPerformance.ps1
          -Configuration Release
          -NoBuild
          -OutputPath "artifacts/studio-performance/${{ matrix.platform }}.json"

      - name: Upload Studio performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-performance-${{ matrix.platform }}
          path: artifacts/studio-performance/${{ matrix.platform }}.json
          if-no-files-found: error

  enterprise-certification:
    needs: source-preflight
    name: Enterprise Certification (${{ matrix.platform }})
    if: github.event_name != 'pull_request' && contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'enterprise-certification')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up browser compiler runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck

      - name: Prepare browser assets
        run: node scripts/sync-assets.js

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run enterprise certification
        shell: pwsh
        run: >
          ./scripts/Test-EnterpriseHardeningCertification.ps1
          -RunId "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          -Platform "${{ matrix.platform }}"

      - name: Retain enterprise certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-certification-${{ matrix.platform }}
          path: certification-results/enterprise-hardening/ci-${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30

  docker-integration-tests:
    needs: source-preflight
    name: Docker Integration Tests
    if: github.event_name != 'pull_request' && contains(fromJSON(needs.source-preflight.outputs.lanes || '[]'), 'docker-integration-tests')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up browser compiler runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck

      - name: Prepare browser assets
        run: node scripts/sync-assets.js

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify .NET
        run: dotnet --info

      - name: Verify Docker
        run: docker info

      - name: Restore dependencies
        run: dotnet restore ETL-SQL.slnx

      - name: Build
        run: dotnet build ETL-SQL.slnx --no-restore --configuration Release

      - name: Install LDAP client library (Linux only)
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libldap-dev || sudo apt-get install -y libldap2-dev || true
          LDAP_SO=$(find /usr/lib -name "libldap.so" | head -n 1)
          if [ -n "$LDAP_SO" ]; then
            sudo ln -s "$LDAP_SO" /usr/lib/x86_64-linux-gnu/libldap-2.5.so.0 || true
            sudo ln -s "$LDAP_SO" /usr/lib/libldap-2.5.so.0 || true
          fi

      # OdbcTransactionCloneTests drives a real SQL Server through Microsoft's ODBC driver.
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          if ! dpkg -s msodbcsql18 >/dev/null 2>&1; then
            if [ ! -f /etc/apt/sources.list.d/microsoft-prod.list ]; then
              curl -sSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
              sudo dpkg -i /tmp/packages-microsoft-prod.deb
            fi
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
          odbcinst -q -d -n "ODBC Driver 18 for SQL Server"

      - name: Pre-pull base Docker images
        shell: pwsh
        run: |
          $images = @(
            'mcr.microsoft.com/dotnet/sdk:10.0',
            'mcr.microsoft.com/dotnet/aspnet:10.0',
            'mcr.microsoft.com/dotnet/runtime:10.0',
            'cgr.dev/chainguard/minio:latest'
          )
          foreach ($img in $images) {
            $pulled = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Write-Host "Pulling $img (attempt $attempt/5)..."
              docker pull $img
              if ($LASTEXITCODE -eq 0) {
                $pulled = $true
                break
              }
              Start-Sleep -Seconds ($attempt * 2)
            }
            if (-not $pulled) {
              Write-Warning "Failed to pre-pull $img after 5 attempts; continuing to build step."
            }
          }

      - name: Build sandbox worker image
        shell: pwsh
        run: .\scripts\Test-SandboxWorkerImage.ps1 -Tag etlsql-sandbox-worker-test:local -Keep

      - name: Enable hardened sandbox runtime (gVisor & local registry)
        run: |
          sudo bash ./scripts/enable-hardened-sandbox-lane.sh etlsql-sandbox-worker-test:local
          echo "ETLSQL_SANDBOX_WORKER_DIGEST_IMAGE=$(cat /tmp/etlsql-pinned-worker-image)" >> $GITHUB_ENV

      - name: Run Docker Integration Tests
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane integration -Configuration Release -NoRestore -NoBuild
