name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .NET
        run: dotnet --info

      - name: Verify Node.js
        run: node --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore ETL-SQL.slnx

      - name: Verify formatting
        run: dotnet format ETL-SQL.slnx --verify-no-changes --no-restore

      - name: Check shared report runtime assets
        shell: pwsh
        run: node .\scripts\sync-assets.js -Check

      - name: Build
        run: dotnet build ETL-SQL.slnx --no-restore --configuration Release

      - name: Run smoke lanes
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane smoke -Configuration Release -NoRestore -NoBuild

      - name: Run tests with coverage
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane fast -Configuration Release -NoRestore -NoBuild -CollectCoverage -ResultsDirectory coverage
        continue-on-error: false

      - name: Generate coverage report
        run: >
          dotnet reportgenerator
          -reports:"./coverage/**/coverage.cobertura.xml"
          -targetdir:"./coverage/report"
          -reporttypes:"Html;Cobertura;TextSummary"
          -assemblyfilters:"+ETL-SQL.*;-ETL-SQL.Tests;-ETL-SQL.PerfTests;-ETL-SQL.Benchmarks;-ETL-SQL.LintTests"

      - name: Print coverage summary
        run: cat ./coverage/report/Summary.txt
        shell: bash

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $summaryPath = "./coverage/report/Summary.txt"
          $content = Get-Content $summaryPath -Raw
          if ($content -match "Line coverage:\s+([\d.]+)%") {
            $lineCoverage = [double]$Matches[1]
            Write-Host "Line coverage: $lineCoverage%"
            # Baseline measured 2026-04-12: 70.5% line coverage
            $threshold = 70.0
            if ($lineCoverage -lt $threshold) {
              Write-Error "Coverage $lineCoverage% is below threshold $threshold%"
              exit 1
            }
          } else {
            Write-Warning "Could not parse coverage from summary — skipping gate"
          }

  build-vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .NET
        run: dotnet --info

      - name: Build engine for integration tests
        run: dotnet build src/ETL-SQL.App/ETL-SQL.App.csproj --configuration Debug

      - name: Verify Node.js
        run: node --version

      - name: Install dependencies
        working-directory: src/etl-sql-vscode
        run: npm ci

      - name: Compile extension
        working-directory: src/etl-sql-vscode
        run: npm run compile

      - name: Run vitest
        working-directory: src/etl-sql-vscode
        run: npm run test:unit
