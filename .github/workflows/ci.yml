name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify .NET
        run: dotnet --info

      - name: Verify Node.js
        run: node --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore ETL-SQL.slnx

      - name: Audit NuGet packages for known vulnerabilities
        shell: pwsh
        run: .\scripts\Test-VulnerablePackages.ps1

      - name: Verify formatting
        run: dotnet format ETL-SQL.slnx --verify-no-changes --no-restore

      - name: Check shared report runtime assets
        shell: pwsh
        run: node .\scripts\sync-assets.js -Check

      - name: Check for flaky sleep-then-assert test delays
        run: node scripts/check-flaky-test-delays.mjs

      - name: Build
        run: dotnet build ETL-SQL.slnx --no-restore --configuration Release

      - name: Run smoke lanes
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane smoke -Configuration Release -NoRestore -NoBuild

      - name: Run tests with coverage
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane engine -Configuration Release -NoRestore -NoBuild -CollectCoverage -ResultsDirectory coverage
        continue-on-error: false

      - name: Generate coverage report
        run: >
          dotnet reportgenerator
          -reports:"./coverage/**/coverage.cobertura.xml"
          -targetdir:"./coverage/report"
          -reporttypes:"Html;Cobertura;TextSummary"
          -assemblyfilters:"+ETL-SQL;+ETL-SQL.*;-ETL-SQL.Tests;-ETL-SQL.PerfTests;-ETL-SQL.Benchmarks;-ETL-SQL.LintTests;-ETL-SQL.Portal.Migrations.*"

      - name: Print coverage summary
        run: cat ./coverage/report/Summary.txt
        shell: bash

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $summaryPath = "./coverage/report/Summary.txt"
          $content = Get-Content $summaryPath -Raw
          if ($content -match "Line coverage:\s+([\d.]+)%") {
            $lineCoverage = [double]$Matches[1]
            Write-Host "Line coverage: $lineCoverage%"
            # Baseline measured 2026-04-12: 70.5% line coverage.
            $threshold = 70.0
            if ($lineCoverage -lt $threshold) {
              Write-Error "Coverage $lineCoverage% is below threshold $threshold%"
              exit 1
            }
          } else {
            Write-Warning "Could not parse coverage from summary — skipping gate"
          }

  build-vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify .NET
        run: dotnet --info

      - name: Build engine for integration tests
        run: dotnet build src/ETL-SQL.App/ETL-SQL.App.csproj --configuration Debug

      - name: Verify Node.js
        run: node --version

      - name: Install dependencies
        working-directory: src/etl-sql-vscode
        run: npm ci

      - name: Install UI dependencies
        working-directory: src/etl-sql-vscode/ui
        run: npm ci

      - name: Audit npm packages for known vulnerabilities
        working-directory: src/etl-sql-vscode
        run: npm audit

      - name: Audit UI npm packages for known vulnerabilities
        working-directory: src/etl-sql-vscode/ui
        run: npm audit

      - name: Compile extension
        working-directory: src/etl-sql-vscode
        run: npm run compile

      - name: Lint extension
        working-directory: src/etl-sql-vscode
        run: npm run lint

      - name: Lint UI package
        working-directory: src/etl-sql-vscode/ui
        run: npm run lint

      - name: Build UI package
        working-directory: src/etl-sql-vscode/ui
        run: npm run build

      - name: Run UI vitest
        working-directory: src/etl-sql-vscode/ui
        run: npm run test:unit

      - name: Run vitest
        working-directory: src/etl-sql-vscode
        run: npm run test:unit

  portal-browser-journey:
    name: Portal Browser Journey
    # windows-latest matches the platform the lane is developed and validated on, and the Portal's
    # own build-and-test job. Kept separate from that job so a browser flake never blocks the
    # coverage gate, and so the ~113 MB Chromium download is cached independently.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore VS Code UI dependencies
        working-directory: src/etl-sql-vscode/ui
        run: npm ci

      - name: Build VS Code UI package
        working-directory: src/etl-sql-vscode/ui
        run: npm run build

      # Keyed on the Microsoft.Playwright version in Directory.Packages.props: bumping the package
      # must fetch a matching browser build rather than reuse the previous one.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-windows-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: playwright-windows-

      - name: Build browser lane
        run: dotnet build tests/ETL-SQL.Portal.BrowserTests/ETL-SQL.Portal.BrowserTests.csproj --configuration Release

      - name: Run browser lane
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane browser -Configuration Release -NoRestore -NoBuild

  enterprise-certification:
    name: Enterprise Certification (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run enterprise certification
        shell: pwsh
        run: >
          ./scripts/Test-EnterpriseHardeningCertification.ps1
          -RunId "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          -Platform "${{ matrix.platform }}"

      - name: Retain enterprise certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-certification-${{ matrix.platform }}
          path: certification-results/enterprise-hardening/ci-${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30

  docker-integration-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify .NET
        run: dotnet --info

      - name: Verify Docker
        run: docker info

      - name: Restore dependencies
        run: dotnet restore ETL-SQL.slnx

      - name: Build
        run: dotnet build ETL-SQL.slnx --no-restore --configuration Release

      - name: Install LDAP client library (Linux only)
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libldap-dev || sudo apt-get install -y libldap2-dev || true
          LDAP_SO=$(find /usr/lib -name "libldap.so" | head -n 1)
          if [ -n "$LDAP_SO" ]; then
            sudo ln -s "$LDAP_SO" /usr/lib/x86_64-linux-gnu/libldap-2.5.so.0 || true
            sudo ln -s "$LDAP_SO" /usr/lib/libldap-2.5.so.0 || true
          fi

      - name: Run Docker Integration Tests
        shell: pwsh
        run: .\scripts\test-lane.ps1 -Lane integration -Configuration Release -NoRestore -NoBuild
