name: XT08 Windows service qualification

on:
  push:
    branches: ['test/xt08-windows-service-qualification']

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Run the Windows service fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $MechanicsOnly = $false
          . ./scripts/lib/windows-tool-artifact-fixture.ps1
          Assert-FixturePublisher

          $evidence = Join-Path $env:RUNNER_TEMP 'xt08-evidence'
          $null = New-Item -ItemType Directory -Path $evidence
          $output = Join-Path $env:RUNNER_TEMP 'xt08-bundle'
          $bundle = & ./scripts/New-WindowsToolArtifactQualificationBundle.ps1 -OutputDirectory $output
          $bundle | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'bundle.json') -Encoding utf8NoBOM

          $expanded = Join-Path $env:RUNNER_TEMP 'xt08-expanded'
          [IO.Compression.ZipFile]::ExtractToDirectory($bundle.Archive, $expanded)
          $parent = Join-Path ($env:SystemDrive + '\') ('ETLSQL-XT08-' + [guid]::NewGuid().ToString('N'))
          $parentItem = [IO.Directory]::CreateDirectory($parent)
          $readers = [Security.Principal.SecurityIdentifier]::new(
              [Security.Principal.WellKnownSidType]::AuthenticatedUserSid, $null)
          Protect-FixtureItem $parentItem $readers
          Assert-PublisherFixture $parentItem $parent

          $entry = Join-Path $expanded 'Invoke-BundledWindowsToolArtifactQualification.ps1'
          $proof = & $entry -FixtureParent $parent
          if ((@($proof.Receipts.ActiveGeneration) -join ',') -ne '1,2,1' -or
              @($proof.Receipts | Where-Object { -not $_.ServiceBoundaryVerified }).Count) {
              throw 'Missing the three restricted-service receipts.'
          }

          $report = [ordered]@{
              CommitSha = $env:GITHUB_SHA
              WorkflowRunId = $env:GITHUB_RUN_ID
              ImageOS = $env:ImageOS
              ImageVersion = $env:ImageVersion
              BundleSha256 = $bundle.Sha256
              WorkerProfile = $proof.WorkerProfile
              Receipts = $proof.Receipts
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence 'receipts.json') -Encoding utf8NoBOM
          $proof.Receipts | Format-Table Stage, ActiveGeneration, ServiceBoundaryVerified, FixtureSha256
      - name: Upload qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xt08-windows-service-evidence
          path: ${{ runner.temp }}/xt08-evidence
          if-no-files-found: ignore
          retention-days: 14
