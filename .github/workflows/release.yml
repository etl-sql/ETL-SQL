name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on any version tag like v0.7.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.8.0)'
        required: true
        default: 'v0.8.0'

permissions:
  contents: write

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  # 1. Validation Job - ensures the release is stable
  validate:
    name: Validate & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
      - name: Verify release tag is on main
        shell: pwsh
        run: |
          $TagCommit = git rev-parse "$env:TAG_NAME^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Release tag '$env:TAG_NAME' does not exist." }

          git merge-base --is-ancestor $TagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:TAG_NAME' must point to a commit reachable from main."
          }
      - name: Verify .NET
        run: dotnet --info
      - name: Build & Run Smoke Tests
        shell: pwsh
        run: |
          dotnet build ETL-SQL.slnx --configuration Release
          .\scripts\test-lane.ps1 -Lane smoke -Configuration Release -NoRestore -NoBuild

  prepare-release:
    name: Prepare GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Create or update draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(env.TAG_NAME, 'alpha') || contains(env.TAG_NAME, 'beta') || contains(env.TAG_NAME, 'rc') }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --draft "${args[@]}"
          else
            gh release create "$TAG_NAME" --draft --generate-notes "${args[@]}"
          fi

  # 2. Windows Build (ZIP + MSI)
  build-windows:
    name: Build Windows (MSI & ZIP)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
      - name: Verify .NET
        run: dotnet --info
      - name: Verify Node.js
        run: node --version

      - name: Build & Publish
        shell: pwsh
        run: |
          $Version = $env:TAG_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          .\scripts\publish_release.ps1 -Platforms win-x64

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset -y --no-progress --skip-if-installed

      - name: Build MSI
        shell: pwsh
        run: |
          $Version = $env:TAG_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          .\scripts\build_msi.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_msi.ps1 failed with exit code $LASTEXITCODE" }
          Move-Item "src/ETL-SQL.Installer/ETL-SQL-v$Version.msi" "release/ETL-SQL-v$Version-x64-Setup.msi"

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:TAG_NAME release/*.zip release/*.msi release/*.vsix --clobber

  # 3. Linux Build (ZIP + DEB)
  build-linux:
    name: Build Linux (DEB & ZIP)
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
      - name: Verify .NET
        run: dotnet --info
      - name: Verify Node.js
        run: node --version

      - name: Publish Binaries
        shell: pwsh
        run: |
          $Version = $env:TAG_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          ./scripts/publish_release.ps1 -Platforms linux-x64
          chmod +x scripts/build_linux_packages.sh
          ./scripts/build_linux_packages.sh $Version release/linux-x64/bin
          mv "etl-sql_${Version}_amd64.deb" release/

      - name: Upload Linux release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" release/*.zip release/*.deb release/*.vsix --clobber

  # 4. macOS Build (ZIP + DMG)
  build-macos:
    name: Build macOS (DMG & ZIP)
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
      - name: Verify .NET
        run: dotnet --info
      - name: Verify Node.js
        run: node --version

      # Apple Silicon is the priority artifact (most current Macs). Publish and upload it
      # FIRST so an Intel/R2R failure below can never cost us the arm64 release. Each
      # publish_release.ps1 run wipes release/, so arm64 is safely uploaded before x64 starts.
      - name: Publish Apple Silicon (arm64) VSIX + ZIP
        shell: pwsh
        run: |
          $Version = $env:TAG_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          ./scripts/publish_release.ps1 -Platforms osx-arm64

      - name: Upload arm64 release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" release/*.zip release/*.vsix --clobber

      # Intel build is best-effort: if osx-x64 R2R cross-gen breaks on the arm64 runner,
      # the job degrades (arm64 already shipped) instead of failing the whole release.
      - name: Publish Intel (x64) VSIX + ZIP (best effort)
        id: macos_x64
        continue-on-error: true
        shell: pwsh
        run: |
          $Version = $env:TAG_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          ./scripts/publish_release.ps1 -Platforms osx-x64

      - name: Upload x64 release assets
        if: steps.macos_x64.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" release/*.zip release/*.vsix --clobber

      # DMG is parked at "TUI launcher" parity and fully optional — never block the release.
      - name: Build & upload macOS DMG (best effort)
        if: steps.macos_x64.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Version="${TAG_NAME#v}"
          chmod +x scripts/build_mac_dmg.sh
          ./scripts/build_mac_dmg.sh "$Version" release/osx-x64/bin
          mv "ETL-SQL_v${Version}.dmg" release/
          gh release upload "$TAG_NAME" release/*.dmg --clobber

      # Make a degraded macOS release visible: the arm64 VSIX/ZIP still shipped, but Intel
      # (x64 VSIX/ZIP + DMG) was dropped. Surfaces as a ::warning:: annotation on the run
      # without failing the job (echo exits 0, so the release still publishes).
      - name: Flag missing Intel (x64) artifacts
        if: steps.macos_x64.outcome == 'failure'
        shell: bash
        run: echo "::warning title=macOS Intel build skipped::osx-x64 publish failed; release ${TAG_NAME} shipped arm64 only (no Intel VSIX/ZIP, no DMG)."

  # 5. Publish GitHub Release
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
