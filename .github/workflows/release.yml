name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on any version tag like v0.7.0


jobs:
  # 1. Validation Job - ensures the release is stable
  validate:
    name: Validate & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Build & Run Smoke Tests
        shell: pwsh
        run: |
          dotnet build ETL-SQL.slnx --configuration Release
          .\scripts\test-lane.ps1 -Lane smoke -Configuration Release -NoRestore -NoBuild

  # 2. Windows Build (ZIP + MSI + VSIX)
  build-windows:
    name: Build Windows (MSI & ZIP)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Build & Publish
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          .\scripts\publish_release.ps1 -Platforms win-x64
      
      - name: Build MSI
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          .\scripts\build_msi.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_msi.ps1 failed with exit code $LASTEXITCODE" }
          Move-Item "src/ETL-SQL.Installer/ETL-SQL-Enterprise-v$Version.msi" "release/ETL-SQL-v$Version-x64-Setup.msi"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/

  # 3. Linux Build (ZIP + DEB)
  build-linux:
    name: Build Linux (DEB & ZIP)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Publish Binaries
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          ./scripts/publish_release.ps1 -Platforms linux-x64
          chmod +x scripts/build_linux_packages.sh
          ./scripts/build_linux_packages.sh $Version release/linux-x64/bin
          mv "etl-sql_${Version}_amd64.deb" release/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            release/*.zip
            release/*.deb

  # 4. macOS Build (ZIP + DMG)
  build-macos:
    name: Build macOS (DMG & ZIP)
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Publish Binaries
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          ./scripts/publish_release.ps1 -Platforms osx-x64
          chmod +x scripts/build_mac_dmg.sh
          ./scripts/build_mac_dmg.sh $Version release/osx-x64/bin
          mv "ETL-SQL_v${Version}.dmg" release/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            release/*.zip
            release/*.dmg

  # 5. Create GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            all-artifacts/*.zip
            all-artifacts/*.msi
            all-artifacts/*.deb
            all-artifacts/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
