name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on any version tag like v0.7.0

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes "${args[@]}"
          fi

  # 1. Windows Build (ZIP + MSI)
  build-windows:
    name: Build Windows (MSI & ZIP)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
          git checkout --force FETCH_HEAD
      - name: Verify .NET
        run: dotnet --info
      - name: Verify Node.js
        run: node --version

      - name: Build & Publish
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          .\scripts\publish_release.ps1 -Platforms win-x64

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset -y --no-progress --skip-if-installed

      - name: Build MSI
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          .\scripts\build_msi.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_msi.ps1 failed with exit code $LASTEXITCODE" }
          Move-Item "src/ETL-SQL.Installer/ETL-SQL-Enterprise-v$Version.msi" "release/ETL-SQL-v$Version-x64-Setup.msi"

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME release/*.zip release/*.msi --clobber

  # 2. Linux Build (ZIP + DEB)
  build-linux:
    name: Build Linux (DEB & ZIP)
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Verify .NET
        run: dotnet --info
      - name: Verify Node.js
        run: node --version

      - name: Publish Binaries
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          ./scripts/publish_release.ps1 -Platforms linux-x64
          chmod +x scripts/build_linux_packages.sh
          ./scripts/build_linux_packages.sh $Version release/linux-x64/bin
          mv "etl-sql_${Version}_amd64.deb" release/

      - name: Upload Linux release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.deb --clobber

  # 3. macOS Build (ZIP + DMG)
  build-macos:
    name: Build macOS (DMG & ZIP)
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Verify .NET
        run: dotnet --info
      - name: Verify Node.js
        run: node --version

      - name: Publish Binaries
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:ETL_SQL_VERSION = $Version
          ./scripts/publish_release.ps1 -Platforms osx-x64
          chmod +x scripts/build_mac_dmg.sh
          ./scripts/build_mac_dmg.sh $Version release/osx-x64/bin
          mv "ETL-SQL_v${Version}.dmg" release/

      - name: Upload macOS release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.dmg --clobber

  # 4. Publish GitHub Release
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
