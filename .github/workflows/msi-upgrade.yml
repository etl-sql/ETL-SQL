name: MSI In-Place Upgrade

# This job downloads a ~900 MB previous release, installs WiX and builds an installer before it can
# assert anything — roughly 26 minutes. Shared package-impact rules select changes that can affect
# the payload; classified documentation and browser-test-only edits skip the expensive jobs.
# The workflow itself always runs for pull requests so the final gate reports success when the
# certification is intentionally skipped. Release calls and manual dispatches run it in full.
on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate commit resolved by the release workflow
        required: true
        type: string
    outputs:
      artifact_id:
        description: Installer pair whose required certification jobs passed
        value: ${{ jobs.msi-upgrade-gate.outputs.artifact_id }}
      receipt_id:
        description: Successful certification receipt artifact
        value: ${{ jobs.msi-upgrade-gate.outputs.receipt_id }}

permissions:
  contents: read

env:
  CERTIFICATION_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  detect-upgrade-impact:
    name: Detect MSI Upgrade Impact
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CERTIFICATION_SHA }}
          fetch-depth: 0

      - name: Set up source-check runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare pinned workflow checker
        run: node scripts/setup-actionlint.mjs
      - name: Collect source preflight findings
        run: node scripts/release-preflight.mjs

      - name: Upload source preflight logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-validation/preflight/
          if-no-files-found: warn
          retention-days: 30

      - name: Classify changed paths
        id: changes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_CALL: ${{ inputs.source_sha != '' }}
        run: |
          $ErrorActionPreference = 'Stop'

          $actualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -cne $env:CERTIFICATION_SHA) {
            throw 'MSI checkout does not match the candidate SHA.'
          }
          $force = $env:EVENT_NAME -eq 'workflow_dispatch' -or $env:RELEASE_CALL -eq 'true'
          if ($force) {
            'should_run=true' >> $env:GITHUB_OUTPUT
            Write-Host 'Running full MSI certification for a release call or manual dispatch.'
            exit 0
          }

          $baseSha = if ($env:EVENT_NAME -eq 'pull_request') {
            if (-not [string]::IsNullOrWhiteSpace($env:BASE_SHA)) { $env:BASE_SHA } else { "origin/$env:GITHUB_BASE_REF" }
          } else {
            $env:BEFORE_SHA
          }
          if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -match '^0+$') {
            'should_run=true' >> $env:GITHUB_OUTPUT
            Write-Host 'No comparison base; full MSI certification is required.'
            exit 0
          }

          # Include both old and new paths for renames across the documentation boundary.
          $changedPaths = @(git -c core.quotePath=false diff --name-only --no-renames $baseSha HEAD --)
          if ($LASTEXITCODE -ne 0) {
            'should_run=true' >> $env:GITHUB_OUTPUT
            Write-Warning 'Cannot compare the complete change range; full MSI certification is required.'
            exit 0
          }

          . ./scripts/MsiImpact.Helpers.ps1
          $impact = Get-MsiUpgradeImpact -ChangedPaths $changedPaths
          $relevant = @($impact.RelevantPaths)
          $shouldRun = $impact.ShouldRun
          "should_run=$($shouldRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($shouldRun) {
            Write-Host 'MSI-impacting paths:'
            $relevant | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host 'Shared package-impact rules found no payload changes; MSI certification will be skipped.'
          }

  build-msi:
    name: Build MSI certification inputs
    outputs:
      artifact_id: ${{ steps.inputs.outputs.artifact-id }}
      previous_tag: ${{ steps.versions.outputs.previous_tag }}
    needs: detect-upgrade-impact
    if: needs.detect-upgrade-impact.outputs.should_run == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CERTIFICATION_SHA }}
          fetch-depth: 0

      - name: Resolve current version and previous release
        id: versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $currentVersion = [string]$props.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($currentVersion)) { throw 'Directory.Build.props has no VersionPrefix.' }

          . ./scripts/Release.Helpers.ps1
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate prior GitHub releases.' }
          $releases = @($pages | ConvertFrom-Json | ForEach-Object { $_ })
          $previousTag = Select-PreviousStableRelease -CurrentVersion $currentVersion -Releases $releases

          "current_version=$currentVersion" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT

      - name: Restore cached previous MSI
        id: previous-cache
        uses: actions/cache@v6
        with:
          path: .upgrade-cache
          key: previous-msi-${{ steps.versions.outputs.previous_tag }}-x64

      - name: Download previous MSI
        if: steps.previous-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.versions.outputs.previous_tag }}
        run: |
          New-Item -ItemType Directory -Force .upgrade-cache | Out-Null
          gh release download $env:PREVIOUS_TAG --dir .upgrade-cache --pattern '*-x64-Setup.msi'
          if (@(Get-ChildItem .upgrade-cache -Filter '*-x64-Setup.msi').Count -ne 1) {
            throw "Expected exactly one x64 MSI for $env:PREVIOUS_TAG."
          }

      # build-msi.ps1 prepares browser assets, which needs the pinned compiler.
      - name: Set up browser compiler runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser compiler
        run: npm ci --prefix scripts/typecheck

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset -y --no-progress --skip-if-installed

      - name: Build current MSI
        shell: pwsh
        env:
          ETL_SQL_VERSION: ${{ steps.versions.outputs.current_version }}
        run: .\scripts\build-msi.ps1

      # Split from the certification below so the log says which half failed. The static contract
      # needs no elevation and no install, and it is where the gate's first real run went wrong —
      # keeping it as its own step means that class of failure is named rather than buried in the
      # output of an install sequence that never started.
      - name: Check the static upgrade contract
        shell: pwsh
        env:
          CURRENT_VERSION: ${{ steps.versions.outputs.current_version }}
        run: |
          $previous = @(Get-ChildItem .upgrade-cache -Filter '*-x64-Setup.msi')
          if ($previous.Count -ne 1) { throw 'Previous MSI cache must contain exactly one MSI.' }
          $current = "src/ETL-SQL.Installer/ETL-SQL-v$env:CURRENT_VERSION.msi"
          .\scripts\Test-MsiUpgrade.ps1 -PreviousMsi $previous[0].FullName -CurrentMsi $current -StaticChecksOnly

      - name: Preserve certification inputs
        shell: pwsh
        env:
          CURRENT_VERSION: ${{ steps.versions.outputs.current_version }}
        run: |
          New-Item -ItemType Directory -Force candidate | Out-Null
          Copy-Item .upgrade-cache/*-x64-Setup.msi candidate/previous.msi
          Copy-Item "src/ETL-SQL.Installer/ETL-SQL-v$env:CURRENT_VERSION.msi" candidate/current.msi
          ./scripts/MsiCandidate.ps1 -Mode Create -Directory candidate -SourceSha $env:CERTIFICATION_SHA

      - name: Upload certification inputs
        id: inputs
        uses: actions/upload-artifact@v7
        with:
          name: msi-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  msi-upgrade:
    name: MSI certification (${{ matrix.profile }})
    needs: build-msi
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [workstation, portal]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CERTIFICATION_SHA }}

      - name: Download pinned certification inputs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-msi.outputs.artifact_id }}
          path: candidate
          merge-multiple: true

      - name: Verify certification inputs
        shell: pwsh
        run: ./scripts/MsiCandidate.ps1 -Mode Verify -Directory candidate -SourceSha $env:CERTIFICATION_SHA

      - name: Set up browser verification runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare candidate browser inventory
        shell: pwsh
        run: |
          npm ci --prefix scripts/typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Browser compiler restore failed.' }
          node scripts/sync-assets.js
          if ($LASTEXITCODE -ne 0) { throw 'Browser asset preparation failed.' }
          node scripts/sync-assets.js -Check
          if ($LASTEXITCODE -ne 0) { throw 'Browser inventory verification failed.' }

      - name: Certify installer profile with bounded supervision
        timeout-minutes: 25
        shell: pwsh
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          $script = if ($env:PROFILE -eq 'portal') { 'scripts/Test-MsiPortalUpgrade.ps1' } else { 'scripts/Test-MsiUpgrade.ps1' }
          ./scripts/Invoke-CertificationProcess.ps1 -ScriptPath $script -ScriptArguments @('-PreviousMsi', 'candidate/previous.msi', '-CurrentMsi', 'candidate/current.msi') -EvidenceDirectory "release-validation/msi-supervisor/$env:PROFILE" -TimeoutSeconds 1200

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-upgrade-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/candidate.json
            release-validation/msi-upgrade
            release-validation/msi-portal-upgrade
            release-validation/msi-supervisor
          if-no-files-found: warn
          retention-days: 30

  msi-upgrade-gate:
    name: MSI In-Place Upgrade
    outputs:
      artifact_id: ${{ steps.gate.outputs.artifact_id }}
      receipt_id: ${{ steps.receipt.outputs.artifact-id }}
    needs:
      - detect-upgrade-impact
      - build-msi
      - msi-upgrade
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require certification when applicable
        id: gate
        shell: pwsh
        env:
          DETECTION_RESULT: ${{ needs.detect-upgrade-impact.result }}
          SHOULD_RUN: ${{ needs.detect-upgrade-impact.outputs.should_run }}
          BUILD_RESULT: ${{ needs.build-msi.result }}
          CERTIFICATION_RESULT: ${{ needs.msi-upgrade.result }}
          ARTIFACT_ID: ${{ needs.build-msi.outputs.artifact_id }}
          PREVIOUS_TAG: ${{ needs.build-msi.outputs.previous_tag }}
        run: |
          if ($env:DETECTION_RESULT -ne 'success') {
            throw "MSI impact detection ended as '$env:DETECTION_RESULT'."
          }
          if ($env:SHOULD_RUN -notin @('true', 'false')) { throw 'MSI impact decision is missing or invalid.' }
          if ($env:SHOULD_RUN -eq 'true' -and ($env:BUILD_RESULT -ne 'success' -or $env:CERTIFICATION_RESULT -ne 'success')) {
            throw "MSI upgrade certification was required but ended as '$env:CERTIFICATION_RESULT'."
          }
          if ($env:SHOULD_RUN -eq 'false' -and ($env:BUILD_RESULT -ne 'skipped' -or $env:CERTIFICATION_RESULT -ne 'skipped')) {
            throw "MSI upgrade certification was not required but ended as '$env:CERTIFICATION_RESULT'."
          }

          if ($env:SHOULD_RUN -eq 'true') {
            if ($env:ARTIFACT_ID -notmatch '^[1-9][0-9]*$') { throw 'Certified artifact ID is missing or invalid.' }
            "artifact_id=$env:ARTIFACT_ID" >> $env:GITHUB_OUTPUT
            @{
              schemaVersion = 1; repository = $env:GITHUB_REPOSITORY
              sourceSha = $env:CERTIFICATION_SHA; runId = $env:GITHUB_RUN_ID
              runAttempt = $env:GITHUB_RUN_ATTEMPT; artifactId = $env:ARTIFACT_ID
              previousTag = $env:PREVIOUS_TAG; workstation = 'success'; portal = 'success'
            } | ConvertTo-Json | Set-Content certification.json
            Write-Host 'MSI upgrade certification passed.'
          } else {
            Write-Host 'MSI upgrade certification was not applicable to this change.'
          }

      - name: Save successful certification receipt
        id: receipt
        if: needs.detect-upgrade-impact.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: msi-certified-${{ github.run_id }}-${{ github.run_attempt }}
          path: certification.json
          if-no-files-found: error
          retention-days: 30
