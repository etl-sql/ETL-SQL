name: Publish to Marketplace

# Publishes the VS Code extensions of a published GitHub Release to the Visual Studio Marketplace
# with OIDC Trusted Publishing (no token). Release calls it after publication; dispatch it by hand
# to retry a failed publish without a new tag. It never builds anything: it publishes the VSIX files
# attached to the release, and only after their build provenance verifies against release.yml on
# that tag. The Marketplace trusts this workflow file as its publisher.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag whose VSIX files to publish (e.g. v0.22.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-marketplace-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish VS Code Extensions to Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: Download the VSIX files of the published release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG_NAME' is not a release tag."; exit 1
          fi
          state=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [ "$state" != "false false" ]; then
            echo "::error::$TAG_NAME is not a published release (draft, prerelease: $state)."; exit 1
          fi
          mkdir dist
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.vsix'

      - name: Verify build provenance from release.yml on the tag
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          vsix_files=(dist/*.vsix)
          if [ ${#vsix_files[@]} -eq 0 ]; then
            echo "::error::No VSIX packages found in the $TAG_NAME release assets."; exit 1
          fi
          for vsix in "${vsix_files[@]}"; do
            gh attestation verify "$vsix" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG_NAME"
            echo "Provenance verified: $(basename "$vsix")"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: 22

      # vsce 4.1.1 is the first release whose OIDC token exchange the Marketplace accepts (it sends
      # api-version and the FederatedToken scheme); 4.0.0 failed v0.22.0 with 400 Bad Request.
      # A vsce "Published" only means the upload was accepted; validation runs afterwards (~20 min).
      # v0.22.0 uploaded four targets back to back, the run went green, and only the first target
      # ever appeared. So each target waits until the public gallery lists it as validated before
      # the next upload, and a target that is already live is skipped.
      - name: Publish platform VSIXs via OIDC Trusted Publishing
        timeout-minutes: 150
        run: |
          set -euo pipefail
          listed() { # $1 version, $2 target -> exit 0 when the gallery lists that version+target validated
            curl -fsS -X POST "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
              -H "Content-Type: application/json" -H "Accept: application/json;api-version=7.2-preview.1" \
              -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"$EXT_ID\"}]}],\"flags\":1}" \
            | jq -e --arg v "$1" --arg t "$2" \
              '[.results[0].extensions[]?.versions[]? | select(.version==$v and .targetPlatform==$t and ((.flags // "") | test("validated")))] | length > 0' >/dev/null
          }
          for vsix in dist/*.vsix; do
            name=$(basename "$vsix")
            if [[ ! "$name" =~ ^(.+)-([0-9]+\.[0-9]+\.[0-9]+)-([a-z0-9]+-[a-z0-9]+)\.vsix$ ]]; then
              echo "::error::Cannot read version and target from $name."; exit 1
            fi
            version=${BASH_REMATCH[2]}; target=${BASH_REMATCH[3]}
            EXT_ID=$(unzip -p "$vsix" extension/package.json | jq -r '"\(.publisher).\(.name)"')
            if listed "$version" "$target"; then
              echo "$EXT_ID $version ($target) is already live; skipping."; continue
            fi
            echo "Publishing $name to Visual Studio Marketplace via OIDC..."
            npx --yes @vscode/vsce@4.1.1 publish --oidc --skip-duplicate --packagePath "$vsix"
            echo "Waiting for the Marketplace to validate $target..."
            deadline=$((SECONDS + 45 * 60))
            until listed "$version" "$target"; do
              if (( SECONDS > deadline )); then
                echo "::error::$EXT_ID $version ($target) was uploaded but is not listed after 45 minutes. Check View status in the publisher hub."
                exit 1
              fi
              sleep 60
            done
            echo "$EXT_ID $version ($target) is live."
          done
