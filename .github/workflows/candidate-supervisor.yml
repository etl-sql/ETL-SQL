name: Release Candidate Supervisor

# Starts with every push to a release branch and watches all workflow runs for that exact SHA,
# including Release Certification, native packages and DEB dispatched after the push.
# Known infrastructure/flaky failures are rerun automatically; a real defect cancels the long
# package runs and opens an issue within minutes. See scripts/candidate-supervisor.mjs.
on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read
  actions: write
  issues: write

# A newer push makes a new candidate; stop supervising the old one.
concurrency:
  group: candidate-supervisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native packages and DEB have no push trigger: their release evidence must be a dispatched run.
  # Start them here when the CI impact map says the push changed something packaged, as MSI does on
  # its own push. A docs-only push skips them; the nightly covers the branch HEAD.
  start-packages:
    name: Start package certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 8
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dispatch native and DEB certification when packages are affected
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          args=(--head "$GITHUB_SHA" --output package-impact.json)
          # No usable base selects everything, so a new branch or a force push still certifies packages.
          if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then args+=(--base "$BEFORE_SHA"); fi
          node scripts/select-ci-lanes.mjs "${args[@]}"
          if [ "$(node -p "require('./package-impact.json').nativePackages")" != true ]; then
            echo "No packaged path changed since $BEFORE_SHA; package certification not started."
            exit 0
          fi
          # A dispatch runs the branch HEAD. If a newer push moved it, that push starts its own.
          head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME moved to $head; the newer push starts package certification."
            exit 0
          fi
          for workflow in native-packages.yml deb-upgrade.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f from_push=true
          done
          echo "Started native and DEB certification for $GITHUB_SHA."

  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Only the supervisor scripts are needed. A slow checkout gets one longer retry so the
      # supervisor itself survives the Git slowdowns it is meant to absorb.
      - id: checkout
        uses: actions/checkout@v6
        timeout-minutes: 4
        continue-on-error: true
        with:
          sparse-checkout: scripts
      - if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6
        timeout-minutes: 8
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Supervise candidate runs
        timeout-minutes: 175
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/candidate-supervisor.mjs "$GITHUB_REPOSITORY" "$GITHUB_SHA"
